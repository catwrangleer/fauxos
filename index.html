    const canvas = container.querySelector('.cl-canvas');
    const consoleEl = container.querySelector('.cl-console');
    const fnameInput = container.querySelector('.cl-fname');
    const fnList = container.querySelector('.cl-fnlist');
    let activeTab = 'blocks';

    let script = [
      {type:'setvar', value:{name:'n', expr:'5'}},
      {type:'forward', value:'60'}, {type:'right', value:'90'},
      {type:'repeat', value:'n'}, {type:'forward', value:'40'}, {type:'right', value:'90'}, {type:'endrepeat'},
      {type:'print', value:'sides: $n'}
    ];

    let funcs = {};
    try{ funcs = JSON.parse(localStorage.getItem('fauxos-codelab-fns'))||{}; }catch(e){}
    function saveFuncs(){ try{ localStorage.setItem('fauxos-codelab-fns', JSON.stringify(funcs)); }catch(e){} }

    const EXPR_TYPES = ['forward','backward','right','left','repeat','wait','setangle','circle','square','triangle','if'];
    const TWOFIELD_TYPES = {goto:['x','y'], setvar:['name','expr'], rectangle:['w','h'], polygon:['sides','size']};
    const LABELS = {forward:'Forward',backward:'Backward',right:'Turn Right °',left:'Turn Left °',
      setangle:'Set Angle °',goto:'Go To',home:'Home (reset pos)',penup:'Pen Up',pendown:'Pen Down',
      repeat:'Repeat × times',endrepeat:'End Repeat',if:'If (expr)',else:'Else',endif:'End If',
      wait:'Wait (ms)',waitkey:'Wait For Key (sets key)',call:'Call function',
      setvar:'Set Variable',color:'Set Color',print:'Print',clear:'Clear Screen',
      circle:'Circle radius',square:'Square size',rectangle:'Rectangle',triangle:'Triangle size',polygon:'Polygon'};
    function defaultValue(type){
      if(type==='forward'||type==='backward') return '50';
      if(type==='right'||type==='left'||type==='setangle') return '90';
      if(type==='repeat') return '4';
      if(type==='wait') return '500';
      if(type==='if') return 'key = 1';
      if(type==='goto') return {x:'0',y:'0'};
      if(type==='setvar') return {name:'n', expr:'0'};
      if(type==='color') return '#3b82f6';
      if(type==='print') return 'Hello! $n';
      if(type==='call') return Object.keys(funcs)[0] || '';
      if(type==='circle') return '30';
      if(type==='square') return '40';
      if(type==='triangle') return '40';
      if(type==='rectangle') return {w:'60', h:'30'};
      if(type==='polygon') return {sides:'6', size:'25'};
      return null;
    }

    function renderFnList(){
      const names = Object.keys(funcs);
      fnList.innerHTML = names.length ? names.map(n=>`<span class="cl-chip">${esc(n)}<b data-del="${esc(n)}">✕</b></span>`).join('') :
        `<span style="color:#999;font-size:11px;">No functions saved yet</span>`;
      fnList.querySelectorAll('[data-del]').forEach(b=>{
        b.addEventListener('click', ()=>{ delete funcs[b.dataset.del]; saveFuncs(); renderFnList(); renderScript(); });
      });
    }

    function renderScript(){
      scriptEl.innerHTML = script.length ? '' : `<div style="color:#999;font-size:12px;padding:10px;">Click a block on the left to add it here.</div>`;
      script.forEach((b,i)=>{
        const row = document.createElement('div');
        row.className = 'cl-block cl-block-'+b.type;
        let field = '';
        if(EXPR_TYPES.includes(b.type)){
          field = `<input type="text" class="cl-input" data-i="${i}" value="${esc(b.value)}" placeholder="number or expr">`;
        } else if(b.type==='color'){
          field = `<input type="color" class="cl-input" data-i="${i}" value="${esc(b.value)}">`;
        } else if(b.type==='print'){
          field = `<input type="text" class="cl-input" data-i="${i}" value="${esc(b.value)}" placeholder="text or $var">`;
        } else if(b.type==='call'){
          const names = Object.keys(funcs);
          field = `<select class="cl-input" data-i="${i}">${names.length?names.map(n=>`<option value="${esc(n)}" ${n===b.value?'selected':''}>${esc(n)}</option>`).join(''):'<option value="">(none saved)</option>'}</select>`;
        } else if(TWOFIELD_TYPES[b.type]){
          const [f1,f2] = TWOFIELD_TYPES[b.type];
          const sep = b.type==='setvar' ? '<span style="color:#999;">=</span>' : '<span style="color:#999;">×</span>';
          field = `<input type="text" class="cl-input" data-i="${i}" data-field="${f1}" value="${esc(b.value[f1])}" placeholder="${f1}">
                    ${sep}
                    <input type="text" class="cl-input" data-i="${i}" data-field="${f2}" value="${esc(b.value[f2])}" placeholder="${f2}">`;
        }
        row.innerHTML = `<span class="cl-blabel">${LABELS[b.type]}</span>${field}
          <span class="cl-brow-btns">
            <button data-up="${i}" title="Move up">↑</button>
            <button data-down="${i}" title="Move down">↓</button>
            <button data-del="${i}" title="Remove">✕</button>
          </span>`;
        scriptEl.appendChild(row);
      });
      scriptEl.querySelectorAll('.cl-input').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const i = +inp.dataset.i, field = inp.dataset.field;
          if(field){
            if(!script[i].value || typeof script[i].value!=='object') script[i].value={};
            script[i].value[field] = inp.value;
          } else {
            script[i].value = inp.value;
          }
        });
      });
      scriptEl.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click', ()=>{
        const i=+b.dataset.up; if(i>0){ [script[i-1],script[i]]=[script[i],script[i-1]]; renderScript(); }
      }));
      scriptEl.querySelectorAll('[data-down]').forEach(b=>b.addEventListener('click', ()=>{
        const i=+b.dataset.down; if(i<script.length-1){ [script[i+1],script[i]]=[script[i],script[i+1]]; renderScript(); }
      }));
      scriptEl.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
        script.splice(+b.dataset.del,1); renderScript();
      }));
    }

    container.querySelectorAll('.cl-palette [data-add]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const type = btn.dataset.add;
        script.push({type, value:defaultValue(type)});
        renderScript();
      });
    });

    tabs.forEach(t=>t.addEventListener('click', ()=>{
      tabs.forEach(x=>x.classList.remove('active')); t.classList.add('active');
      activeTab = t.dataset.tab;
      blocksPanel.style.display = activeTab==='blocks' ? 'flex' : 'none';
      textPanel.style.display = activeTab==='text' ? 'block' : 'none';
    }));

    function parseText(code){
      const cmds = [];
      code.split('\n').forEach(line=>{
        const trimmed = line.trim();
        if(!trimmed || trimmed.startsWith('#')) return;
        const parts = trimmed.match(/"[^"]*"|\S+/g) || [];
        const kw = (parts[0]||'').toLowerCase();
        const restSp = parts.slice(1).join(' ').replace(/^"|"$/g,'');
        const restTight = parts.slice(1).join('');
        if(kw==='forward'||kw==='fd') cmds.push({type:'forward', value:restTight||'0'});
        else if(kw==='backward'||kw==='bk') cmds.push({type:'backward', value:restTight||'0'});
        else if(kw==='right'||kw==='rt') cmds.push({type:'right', value:restTight||'0'});
        else if(kw==='left'||kw==='lt') cmds.push({type:'left', value:restTight||'0'});
        else if(kw==='setangle'||kw==='seth') cmds.push({type:'setangle', value:restTight||'0'});
        else if(kw==='home') cmds.push({type:'home'});
        else if(kw==='goto'||kw==='setpos') cmds.push({type:'goto', value:{x:parts[1]||'0', y:parts[2]||'0'}});
        else if(kw==='penup') cmds.push({type:'penup'});
        else if(kw==='pendown') cmds.push({type:'pendown'});
        else if(kw==='repeat') cmds.push({type:'repeat', value:restTight||'1'});
        else if(kw==='end') cmds.push({type:'endrepeat'});
        else if(kw==='wait') cmds.push({type:'wait', value:restTight||'0'});
        else if(kw==='waitkey') cmds.push({type:'waitkey'});
        else if(kw==='if') cmds.push({type:'if', value:restTight||'0'});
        else if(kw==='else') cmds.push({type:'else'});
        else if(kw==='endif'||kw==='fi') cmds.push({type:'endif'});
        else if(kw==='set') cmds.push({type:'setvar', value:{name:parts[1]||'x', expr:parts.slice(2).join('')||'0'}});
        else if(kw==='circle') cmds.push({type:'circle', value:restTight||'30'});
        else if(kw==='square') cmds.push({type:'square', value:restTight||'40'});
        else if(kw==='triangle') cmds.push({type:'triangle', value:restTight||'40'});
        else if(kw==='rectangle') cmds.push({type:'rectangle', value:{w:parts[1]||'60', h:parts[2]||'30'}});
        else if(kw==='polygon') cmds.push({type:'polygon', value:{sides:parts[1]||'6', size:parts[2]||'25'}});
        else if(kw==='color') cmds.push({type:'color', value:restSp.trim()});
        else if(kw==='print') cmds.push({type:'print', value:restSp});
        else if(kw==='clear') cmds.push({type:'clear'});
        else if(kw==='call') cmds.push({type:'call', value:restSp.trim()});
        else cmds.push({type:'print', value:'⚠ unknown command: '+kw});
      });
      return cmds;
    }

    function inlineCalls(cmds, depth){
      depth = depth||0;
      const out=[];
      cmds.forEach(c=>{
        if(c.type==='call'){
          if(depth<6 && funcs[c.value]) inlineCalls(funcs[c.value], depth+1).forEach(x=>out.push(x));
          else out.push({type:'print', value:'⚠ unknown function: '+c.value});
        } else out.push(c);
      });
      return out;
    }
    function matchEndRepeats(cmds){
      const map={}, stack=[];
      cmds.forEach((c,i)=>{
        if(c.type==='repeat') stack.push(i);
        else if(c.type==='endrepeat'){ const r=stack.pop(); if(r!==undefined) map[r]=i; }
      });
      return map;
    }

    function matchIfs(cmds){
      // For each 'if': index of its 'else' (if any) and 'endif'. For each 'else': its 'endif'.
      const map={}, stack=[];
      cmds.forEach((c,i)=>{
        if(c.type==='if'){ stack.push(i); map[i]={}; }
        else if(c.type==='else'){ const top=stack[stack.length-1]; if(top!==undefined && map[top].else===undefined){ map[top].else=i; map[i]={ifIdx:top}; } }
        else if(c.type==='endif'){ const top=stack.pop(); if(top!==undefined){ map[top].end=i; if(map[top].else!==undefined) map[map[top].else].end=i; } }
      });
      return map;
    }

    let runTimer=null, runId=0, keyWaiter=null;
    const myWin = container.closest('.window');
    function resetStage(){
      clearTimeout(runTimer);
      runId++; keyWaiter=null;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      consoleEl.innerHTML='';
    }
    let lastW = 0;
    function resizeCanvas(){
      const w = Math.max(120, Math.min(Math.round(container.clientWidth*0.62), 520)); // leave room for the console
      if(w===lastW) return;          // height-only resizes shouldn't wipe the drawing
      lastW = w;
      canvas.width = w; canvas.height = 180;
    }
    const clRO = new ResizeObserver(resizeCanvas); clRO.observe(container);
    requestAnimationFrame(resizeCanvas);

    function onKey(e){
      if(!keyWaiter || activeWin!==myWin) return;
      if(isTypingTarget(e.target)) return;
      const code = CL_KEY_MAP[e.key];
      if(!code) return;
      e.preventDefault();
      const w = keyWaiter; keyWaiter=null; w(code);
    }
    window.addEventListener('keydown', onKey);
    onWindowClose(container, ()=>{
      clearTimeout(runTimer); runId++; keyWaiter=null;
      window.removeEventListener('keydown', onKey);
      clRO.disconnect();
    });

    function runProgram(){
      resetStage();
      const myRun = runId;
      const raw = activeTab==='blocks' ? script.map(clCloneBlock) : parseText(codeEl.value);
      const cmds = inlineCalls(raw, 0);
      const matchEnd = matchEndRepeats(cmds);
      const ifMap = matchIfs(cmds);
      const ctx = canvas.getContext('2d');
      let x=canvas.width/2, y=canvas.height/2, angle=0, down=true;
      let vars = {key:0};
      const loopStack = [];
      ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round';
      function log(msg){
        const p=document.createElement('div'); p.textContent=msg;
        consoleEl.appendChild(p); consoleEl.scrollTop=consoleEl.scrollHeight;
      }
      function moveTo(nx,ny){
        if(down){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(nx,ny); ctx.stroke(); }
        x=nx; y=ny;
      }
      // Trace a closed path relative to the turtle (edges[i] = [length, turnAfter]) without moving the turtle.
      function tracePath(edges){
        let px=x, py=y, a=angle;
        ctx.beginPath(); ctx.moveTo(px,py);
        edges.forEach(([len,turn])=>{
          const rad=a*Math.PI/180;
          px+=Math.sin(rad)*len; py-=Math.cos(rad)*len;
          ctx.lineTo(px,py);
          a+=turn;
        });
        ctx.closePath(); ctx.stroke();
      }
      function polygon(n, size){
        n = Math.max(3, Math.min(60, Math.round(n)));
        tracePath(Array.from({length:n}, ()=>[size, 360/n]));
      }
      let pc=0, guard=0;
      function schedule(delay){ runTimer = setTimeout(step, delay); }
      function step(){
        if(myRun!==runId) return;
        if(pc>=cmds.length) return;
        if(guard++>50000){ log('⚠ stopped: program ran too long'); return; }
        const c = cmds[pc];
        let delay = 35;
        if(c.type==='repeat'){
          const times = Math.max(0, Math.round(clEvalExpr(c.value, vars)));
          if(times<=0 || matchEnd[pc]===undefined){ pc = (matchEnd[pc]!==undefined?matchEnd[pc]:cmds.length)+1; }
          else { loopStack.push({repeatIdx:pc, remaining:times-1}); pc++; }
          delay = 0;
        } else if(c.type==='endrepeat'){
          const top = loopStack[loopStack.length-1];
          if(top && top.remaining>0){ top.remaining--; pc = top.repeatIdx+1; }
          else { loopStack.pop(); pc++; }
          delay = 0;
        } else if(c.type==='if'){
          const m = ifMap[pc] || {};
          if(clEvalExpr(c.value, vars)) pc++;
          else if(m.else!==undefined) pc = m.else+1;
          else pc = (m.end!==undefined ? m.end : cmds.length) + 1;
          delay = 0;
        } else if(c.type==='else'){
          // reached from the true branch: skip to after End If
          const m = ifMap[pc] || {};
          pc = (m.end!==undefined ? m.end : cmds.length) + 1;
          delay = 0;
        } else if(c.type==='endif'){
          pc++; delay = 0;
        } else if(c.type==='waitkey'){
          log('⌨️ press a key…');
          try{ canvas.focus({preventScroll:true}); }catch(e){}
          keyWaiter = (code)=>{
            if(myRun!==runId) return;
            vars.key = code; pc++; schedule(0);
          };
          return; // resume when a key arrives
        } else {
          if(c.type==='forward'){
            const rad = angle*Math.PI/180, d = clEvalExpr(c.value, vars);
            moveTo(x+Math.sin(rad)*d, y-Math.cos(rad)*d);
          } else if(c.type==='backward'){
            const rad = angle*Math.PI/180, d = clEvalExpr(c.value, vars);
            moveTo(x-Math.sin(rad)*d, y+Math.cos(rad)*d);
          } else if(c.type==='right'){ angle += clEvalExpr(c.value, vars); }
          else if(c.type==='left'){ angle -= clEvalExpr(c.value, vars); }
          else if(c.type==='setangle'){ angle = clEvalExpr(c.value, vars); }
          else if(c.type==='home'){ x=canvas.width/2; y=canvas.height/2; angle=0; }
          else if(c.type==='goto'){ moveTo(canvas.width/2+clEvalExpr(c.value.x,vars), canvas.height/2-clEvalExpr(c.value.y,vars)); }
          else if(c.type==='penup'){ down=false; }
          else if(c.type==='pendown'){ down=true; }
          else if(c.type==='color'){ ctx.strokeStyle=c.value; }
          else if(c.type==='setvar'){ vars[c.value.name] = clEvalExpr(c.value.expr, vars); }
          else if(c.type==='print'){ log(clInterpolate(c.value, vars)); }
          else if(c.type==='clear'){ ctx.clearRect(0,0,canvas.width,canvas.height); x=canvas.width/2; y=canvas.height/2; angle=0; }
          else if(c.type==='wait'){ delay = Math.max(0, clEvalExpr(c.value, vars)); }
          // Shapes are drawn around/from the turtle's current spot and heading; the turtle stays put.
          else if(c.type==='circle'){
            const r = Math.abs(clEvalExpr(c.value, vars));
            ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
          }
          else if(c.type==='square'){ polygon(4, clEvalExpr(c.value, vars)); }
          else if(c.type==='triangle'){ polygon(3, clEvalExpr(c.value, vars)); }
          else if(c.type==='rectangle'){
            const w = clEvalExpr(c.value.w, vars), h = clEvalExpr(c.value.h, vars);
            tracePath([[h,90],[w,90],[h,90],[w,90]]);
          }
          else if(c.type==='polygon'){ polygon(clEvalExpr(c.value.sides, vars), clEvalExpr(c.value.size, vars)); }
          pc++;
        }
        schedule(delay);
      }
      step();
    }

    container.querySelector('.cl-run').addEventListener('click', runProgram);
    container.querySelector('.cl-resetbtn').addEventListener('click', resetStage);
    container.querySelector('.cl-savefn').addEventListener('click', ()=>{
      const name = fnameInput.value.trim();
      if(!name) return;
      const src = activeTab==='blocks' ? script.map(clCloneBlock) : parseText(codeEl.value);
      funcs[name] = src;
      saveFuncs(); renderFnList(); renderScript();
      fnameInput.value='';
    });

    renderFnList();
    renderScript();
  }



  // ---------- Sign in (FauxAuth) ----------
  // Three ways in:
  //  • Local FauxOS accounts — work anywhere, including a downloaded .html file. Name, avatar and an optional password.
  //    Passwords are salted and hashed (PBKDF2-SHA-256 via the browser's Web Crypto) before being saved, and never
  //    leave this browser. Each account gets its own files, settings, apps and scores (see ACCT at the top).
  //  • Your Claude account — when FauxOS is opened as a published Claude page (Chat needs this).
  //  • Guest — no account; uses the device's shared default data.
  //
  // For apps:
  //   FauxAuth.current             -> {id, name, avatarUrl, color, isGuest, isLocal, isOwner} or null when signed out
  //   FauxAuth.onChange(fn)        -> fn(current) on every sign in/out; returns an unsubscribe function
  //   FauxAuth.whenSignedIn()      -> Promise of the current user once someone is signed in
  //   await FauxAuth.profiles(ids) -> {id: {name, avatarUrl, color, isMe}} — resolve names when drawing; store only ids
  const FauxAuth = (function(){
    const lockEl = document.getElementById('lockScreen');
    const EMOJI = ['🦊','🐼','🐙','🦉','🐢','🦄','🐝','🐧','🦁','🐸','🐱','🐶','🚀','🌵','🍩','⚡'];
    const COLORS = ['#3b82f6','#22a35a','#e0663a','#8b5cf6','#ec4899','#0ea5e9','#d9a400','#64748b'];
    const accounts = ACCT.accounts;
    const hasClaude = !!(window.claude && window.claude.use);
    const hasCrypto = !!(window.crypto && crypto.subtle && window.TextEncoder);
    let prefs = {};
    try{ prefs = JSON.parse(localStorage.getItem('fauxos-auth'))||{}; }catch(e){}
    const savePrefs = ()=>{ try{ localStorage.setItem('fauxos-auth', JSON.stringify(prefs)); }catch(e){} };
    const saveAccounts = ()=>{ try{ localStorage.setItem('fauxos-accounts', JSON.stringify(accounts)); return true; }catch(e){ return false; } };
    if(!prefs.guestId){ prefs.guestId = 'guest_' + Math.random().toString(36).slice(2,10); prefs.guestEmoji = EMOJI[0]; prefs.guestColor = COLORS[2]; savePrefs(); }

    let userCap = null, viewer = null, resolved = !hasClaude, current = null;
    const listeners = new Set();
    const emit = ()=>{ listeners.forEach(fn=>{ try{ fn(current); }catch(e){} }); renderStartCard(); renderSettings(); };

    const avatarCache = {};
    function avatarFor(emoji, color){
      const k = emoji + color; if(avatarCache[k]) return avatarCache[k];
      const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d');
      g.fillStyle = color; g.beginPath(); g.arc(48,48,48,0,Math.PI*2); g.fill();
      g.font = '52px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(emoji, 48, 54);
      return avatarCache[k] = c.toDataURL();
    }

    // ---- passwords ----
    const toB64 = buf=> btoa(String.fromCharCode(...new Uint8Array(buf)));
    const fromB64 = s=> Uint8Array.from(atob(s), c=>c.charCodeAt(0));
    async function hashPw(pw, saltB64){
      const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:fromB64(saltB64), iterations:150000, hash:'SHA-256'}, key, 256);
      return toB64(bits);
    }
    async function makePw(pw){ const salt = toB64(crypto.getRandomValues(new Uint8Array(16))); return {salt, hash: await hashPw(pw, salt)}; }
    async function checkPw(acc, pw){ if(!acc.hash) return true; if(!hasCrypto) return false; return (await hashPw(pw, acc.salt)) === acc.hash; }

    // ---- entering ----
    function localUser(a){ return {id:'local_'+a.id, name:a.name, avatarUrl:avatarFor(a.emoji, a.color), color:a.color, isGuest:false, isLocal:true, isOwner:false}; }
    function enter(){ lockEl.classList.remove('open'); emit(); }
    function signInClaude(){ current = {id:viewer.id, name:viewer.name || 'You', avatarUrl:viewer.avatarUrl, color:viewer.color, isGuest:false, isLocal:false, isOwner:viewer.isOwner}; prefs.last = 'claude'; savePrefs(); enter(); }
    function signInGuest(){ current = {id:prefs.guestId, name:(prefs.guestName||'').trim() || 'Guest', avatarUrl:avatarFor(prefs.guestEmoji, prefs.guestColor), color:prefs.guestColor, isGuest:true, isLocal:false, isOwner:false}; prefs.last = 'guest'; savePrefs(); enter(); }
    // A local account has its own saved data, so switching into it reloads FauxOS into that account's space.
    function openAccount(acc, keep){
      let ok = false; try{ sessionStorage.setItem('fauxos-session', acc.id); ok = true; }catch(e){}
      prefs.rememberLocal = (keep || !ok) ? acc.id : null; prefs.last = 'local'; savePrefs();
      location.reload();
      // if the host blocks reloading, say so rather than sitting there
      setTimeout(()=>{ const c = lockEl.querySelector('.ls-card'); if(c){ const m = document.createElement('div'); m.className = 'ls-sub'; m.style.marginTop = '8px'; m.textContent = 'Almost there — refresh the page to finish signing in.'; c.appendChild(m); } }, 2500);
    }

    // ---- sign-in screen ----
    function clockText(){ const d = new Date(), h = d.getHours(); return {time:`${(h%12)||12}:${String(d.getMinutes()).padStart(2,'0')}`, date:d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})}; }
    function frame(){
      const c = clockText();
      lockEl.innerHTML = `<div class="ls-inner"><div class="ls-time">${c.time}</div><div class="ls-date">${c.date}</div><div class="ls-card"></div></div>`;
      lockEl.classList.add('open');
      return lockEl.querySelector('.ls-card');
    }
    const el = (tag, cls, text)=>{ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; };
    function avatarImg(src, big){ const i = el('img', big ? 'ls-avatar' : 'ls-tile-av'); i.src = src; i.alt = ''; return i; }

    function viewPick(){
      const card = frame();
      card.append(el('div','ls-name', accounts.length ? "Who's using FauxOS?" : 'Welcome to FauxOS'));
      if(!accounts.length) card.append(el('div','ls-sub','Make an account to keep your own files, settings and high scores on this device.'));
      const tiles = el('div','ls-tiles');
      accounts.forEach(a=>{
        const t = el('button','ls-tile'); t.append(avatarImg(avatarFor(a.emoji, a.color)), el('span','ls-tile-name', a.name));
        if(a.hash) t.append(el('span','ls-tile-lock','🔒'));
        t.addEventListener('click', ()=>viewPassword(a)); tiles.append(t);
      });
      if(hasClaude){
        const t = el('button','ls-tile');
        if(!resolved){ t.disabled = true; t.append(el('span','ls-tile-emoji','⏳'), el('span','ls-tile-name','Checking for a Claude account…')); }
        else if(viewer && viewer.id){ t.append(avatarImg(viewer.avatarUrl), el('span','ls-tile-name', (viewer.name||'You') + ' · Claude')); t.addEventListener('click', signInClaude); }
        if(!resolved || (viewer && viewer.id)) tiles.append(t);
      }
      const add = el('button','ls-tile ls-tile-add'); add.append(el('span','ls-tile-emoji','➕'), el('span','ls-tile-name','New account'));
      add.addEventListener('click', viewCreate); tiles.append(add);
      card.append(tiles);
      const guest = el('button','ls-link','Continue as a guest'); guest.addEventListener('click', viewGuest);
      card.append(guest);
    }

    function viewPassword(acc){
      const card = frame();
      card.append(avatarImg(avatarFor(acc.emoji, acc.color), true), el('div','ls-name', acc.name));
      const form = el('form','ls-actions');
      let pw = null;
      if(acc.hash){ pw = el('input','ls-input'); pw.type = 'password'; pw.placeholder = 'Password'; pw.autocomplete = 'current-password'; form.append(pw); }
      const err = el('div','ls-err'); form.append(err);
      const keep = el('label','ls-skip'); const kb = el('input'); kb.type = 'checkbox'; keep.append(kb, document.createTextNode(' Keep me signed in on this device'));
      const go = el('button','ls-btn primary','Sign in →'); go.type = 'submit';
      const back = el('button','ls-link','← Back'); back.type = 'button'; back.addEventListener('click', viewPick);
      form.append(go, keep, back); card.append(form);
      onFormAction(form, async e=>{
        e.preventDefault(); go.disabled = true; err.textContent = '';
        if(await checkPw(acc, pw ? pw.value : '')) openAccount(acc, kb.checked);
        else { go.disabled = false; err.textContent = hasCrypto ? 'Wrong password — try again.' : "This browser can't check passwords."; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); if(pw){ pw.select(); } }
      });
      form.addEventListener('keydown', e=>e.stopPropagation());
      setTimeout(()=> (pw || go).focus(), 30);
    }

    function pickerRow(list, selected, render, onPick){
      const row = el('div', 'ls-emojis');
      list.forEach(v=>{ const b = el('button', 'ls-emoji'); b.type = 'button'; render(b, v); if(v===selected) b.classList.add('on');
        b.addEventListener('click', ()=>{ row.querySelectorAll('.ls-emoji').forEach(x=>x.classList.remove('on')); b.classList.add('on'); onPick(v); }); row.append(b); });
      return row;
    }
    function hasExistingData(){
      try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.indexOf('fauxos-')===0 && !ACCT.GLOBAL.has(k)) return true; } }catch(e){}
      return false;
    }
    function viewCreate(){
      const card = frame();
      let emoji = EMOJI[Math.floor(Math.random()*EMOJI.length)], color = COLORS[Math.floor(Math.random()*COLORS.length)];
      const av = avatarImg(avatarFor(emoji, color), true);
      card.append(av, el('div','ls-name','New account'));
      const form = el('form','ls-actions');
      const name = el('input','ls-input'); name.placeholder = 'Your name'; name.maxLength = 20; name.autocomplete = 'nickname';
      const refresh = ()=>{ av.src = avatarFor(emoji, color); };
      form.append(name,
        pickerRow(EMOJI, emoji, (b,v)=>b.textContent = v, v=>{ emoji = v; refresh(); }),
        pickerRow(COLORS, color, (b,v)=>{ b.style.background = v; b.classList.add('ls-color'); }, v=>{ color = v; refresh(); }));
      let pw1 = null, pw2 = null;
      if(hasCrypto){
        pw1 = el('input','ls-input'); pw1.type = 'password'; pw1.placeholder = 'Password (optional)'; pw1.autocomplete = 'new-password';
        pw2 = el('input','ls-input'); pw2.type = 'password'; pw2.placeholder = 'Type it again'; pw2.autocomplete = 'new-password'; pw2.style.display = 'none';
        pw1.addEventListener('input', ()=>{ pw2.style.display = pw1.value ? '' : 'none'; });
        form.append(pw1, pw2);
      } else form.append(el('div','ls-sub',"Passwords aren't available in this browser, so this account won't have one."));
      let copy = null;
      if(!ACCT.active && hasExistingData()){
        const lab = el('label','ls-skip'); copy = el('input'); copy.type = 'checkbox'; copy.checked = accounts.length===0;
        lab.append(copy, document.createTextNode(' Bring over the files & settings already on this device')); form.append(lab);
      }
      const keepLab = el('label','ls-skip'); const keep = el('input'); keep.type = 'checkbox'; keepLab.append(keep, document.createTextNode(' Keep me signed in on this device'));
      const err = el('div','ls-err');
      const go = el('button','ls-btn primary','Create account →'); go.type = 'submit';
      const back = el('button','ls-link','← Back'); back.type = 'button'; back.addEventListener('click', viewPick);
      form.append(err, go, keepLab, back); card.append(form);
      form.addEventListener('keydown', e=>e.stopPropagation());
      onFormAction(form, async e=>{
        e.preventDefault(); err.textContent = '';
        const n = name.value.trim();
        if(!n){ err.textContent = 'Pick a name first.'; name.focus(); return; }
        if(accounts.some(a=>a.name.toLowerCase()===n.toLowerCase())){ err.textContent = 'There is already an account with that name.'; name.focus(); return; }
        if(pw1 && pw1.value){
          if(pw1.value.length < 4){ err.textContent = 'Passwords need at least 4 characters.'; pw1.focus(); return; }
          if(pw1.value !== pw2.value){ err.textContent = "The two passwords don't match."; pw2.focus(); return; }
        }
        go.disabled = true; go.textContent = 'Creating…';
        const acc = {id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), name:n, emoji, color, created: Date.now()};
        if(pw1 && pw1.value) Object.assign(acc, await makePw(pw1.value));
        if(copy && copy.checked){
          try{
            const keys = []; for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.indexOf('fauxos-')===0 && !ACCT.GLOBAL.has(k)) keys.push(k); }
            keys.forEach(k=> localStorage.setItem('fauxos@'+acc.id+'-'+k.slice(7), localStorage.getItem(k)));
            await fsStore.copyKey('fs', 'fs@'+acc.id);
          }catch(e){}
        }
        accounts.push(acc);
        if(!saveAccounts()){ accounts.pop(); go.disabled = false; go.textContent = 'Create account →'; err.textContent = "Couldn't save the account — this browser's storage is full or blocked."; return; }
        openAccount(acc, keep.checked);
      });
      setTimeout(()=>name.focus(), 30);
    }

    function viewGuest(){
      const card = frame();
      const av = avatarImg(avatarFor(prefs.guestEmoji, prefs.guestColor), true);
      card.append(av, el('div','ls-name','Guest'), el('div','ls-sub','Guests share this device\'s default space. Make an account to keep your own stuff.'));
      const form = el('form','ls-actions');
      const nick = el('input','ls-input'); nick.placeholder = 'Nickname (optional)'; nick.maxLength = 24; nick.value = prefs.guestName || '';
      form.append(nick, pickerRow(EMOJI.slice(0,10), prefs.guestEmoji, (b,v)=>b.textContent = v, v=>{ prefs.guestEmoji = v; savePrefs(); av.src = avatarFor(v, prefs.guestColor); }));
      const go = el('button','ls-btn primary','Continue →'); go.type = 'submit';
      const back = el('button','ls-link','← Back'); back.type = 'button'; back.addEventListener('click', viewPick);
      form.append(go, back); card.append(form);
      form.addEventListener('keydown', e=>e.stopPropagation());
      onFormAction(form, e=>{ e.preventDefault(); prefs.guestName = nick.value.trim().slice(0,24); savePrefs(); signInGuest(); });
      setTimeout(()=>nick.focus(), 30);
    }

    // Lock screen for the account that's signed in (keeps everything open underneath).
    function viewUnlock(){
      const a = ACCT.active, card = frame();
      card.append(avatarImg(current.avatarUrl, true), el('div','ls-name', current.name), el('div','ls-sub','Locked'));
      const form = el('form','ls-actions'); let pw = null;
      if(a && a.hash){ pw = el('input','ls-input'); pw.type = 'password'; pw.placeholder = 'Password'; form.append(pw); }
      const err = el('div','ls-err');
      const go = el('button','ls-btn primary','Unlock →'); go.type = 'submit';
      const sw = el('button','ls-link','Switch user'); sw.type = 'button'; sw.addEventListener('click', ()=>api.signOut());
      form.append(err, go, sw); card.append(form);
      form.addEventListener('keydown', e=>e.stopPropagation());
      onFormAction(form, async e=>{ e.preventDefault(); if(!a || await checkPw(a, pw ? pw.value : '')) lockEl.classList.remove('open'); else { err.textContent = 'Wrong password — try again.'; if(pw) pw.select(); } });
      setTimeout(()=> (pw || go).focus(), 30);
    }
    setInterval(()=>{ if(lockEl.classList.contains('open')){ const c = clockText(), t = lockEl.querySelector('.ls-time'), d = lockEl.querySelector('.ls-date'); if(t) t.textContent = c.time; if(d) d.textContent = c.date; } }, 15000);

    // ---- account settings (change password / delete) ----
    function modal(title, build){
      const wrap = el('div','fx-modal'), box = el('div','fx-modal-box');
      box.append(el('div','fx-modal-title', title)); wrap.append(box); document.body.append(wrap);
      const close = ()=>wrap.remove();
      wrap.addEventListener('click', e=>{ if(e.target===wrap) close(); });
      wrap.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
      build(box, close);
    }
    function changePassword(){
      const a = ACCT.active; if(!a) return;
      modal(a.hash ? 'Change password' : 'Add a password', (box, close)=>{
        const form = el('form','fx-form'); let old = null;
        if(a.hash){ old = el('input'); old.type = 'password'; old.placeholder = 'Current password'; form.append(old); }
        const p1 = el('input'); p1.type = 'password'; p1.placeholder = 'New password (blank = no password)';
        const p2 = el('input'); p2.type = 'password'; p2.placeholder = 'Type the new one again';
        const err = el('div','ls-err'), row = el('div','fx-row');
        const cancel = el('button','fx-btn','Cancel'); cancel.type = 'button'; cancel.addEventListener('click', close);
        const save = el('button','fx-btn primary','Save'); save.type = 'submit';
        row.append(cancel, save); form.append(p1, p2, err, row); box.append(form);
        if(!hasCrypto){ err.textContent = "This browser can't set passwords."; save.disabled = true; }
        onFormAction(form, async e=>{
          e.preventDefault(); err.textContent = '';
          if(old && !(await checkPw(a, old.value))){ err.textContent = 'Your current password is wrong.'; return; }
          if(p1.value && p1.value.length < 4){ err.textContent = 'Passwords need at least 4 characters.'; return; }
          if(p1.value !== p2.value){ err.textContent = "The new passwords don't match."; return; }
          if(p1.value) Object.assign(a, await makePw(p1.value)); else { delete a.hash; delete a.salt; }
          saveAccounts(); close(); toast(p1.value ? '🔒 Password saved' : 'Password removed');
        });
        setTimeout(()=> (old || p1).focus(), 30);
      });
    }
    function deleteAccount(){
      const a = ACCT.active; if(!a) return;
      modal('Delete this account?', (box, close)=>{
        box.append(el('div','fx-modal-text', `This permanently removes “${a.name}” and everything saved in it on this device — files, settings, apps and scores.`));
        const form = el('form','fx-form'); let pw = null;
        if(a.hash){ pw = el('input'); pw.type = 'password'; pw.placeholder = 'Password to confirm'; form.append(pw); }
        const err = el('div','ls-err'), row = el('div','fx-row');
        const cancel = el('button','fx-btn','Cancel'); cancel.type = 'button'; cancel.addEventListener('click', close);
        const del = el('button','fx-btn danger','Delete account'); del.type = 'submit';
        row.append(cancel, del); form.append(err, row); box.append(form);
        onFormAction(form, async e=>{
          e.preventDefault();
          if(pw && !(await checkPw(a, pw.value))){ err.textContent = 'Wrong password.'; return; }
          const prefix = 'fauxos@' + a.id + '-', doomed = [];
          try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.indexOf(prefix)===0) doomed.push(k); } }catch(e){}
          doomed.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
          try{ await fsStore.removeKey('fs@' + a.id); }catch(e){}
          const i = accounts.findIndex(x=>x.id===a.id); if(i>-1) accounts.splice(i,1); saveAccounts();
          api.signOut();
        });
      });
    }

    // ---- start menu + settings ----
    function kindLabel(u){ return u.isGuest ? 'Guest on this device' : u.isLocal ? 'FauxOS account' : 'Claude account'; }
    function renderStartCard(){
      const box = document.querySelector('#startMenu .su-card'); if(!box) return;
      box.innerHTML = ''; if(!current) return;
      const text = el('div','su-text'); text.append(el('div','su-name', current.name), el('div','su-sub', kindLabel(current)));
      const lockB = el('button','su-btn','🔒'); lockB.title = 'Lock';
      const outB = el('button','su-btn','⏻'); outB.title = 'Sign out';
      lockB.addEventListener('click', e=>{ e.stopPropagation(); startMenu.classList.remove('open'); api.lock(); });
      outB.addEventListener('click', e=>{ e.stopPropagation(); startMenu.classList.remove('open'); api.signOut(); });
      const img = el('img','su-avatar'); img.src = current.avatarUrl; img.alt = '';
      box.append(img, text, lockB, outB);
    }
    function renderSettings(){
      document.querySelectorAll('.set-account').forEach(box=>{
        box.innerHTML = '';
        if(!current){ box.textContent = 'Signed out'; return; }
        const img = el('img'); img.src = current.avatarUrl; img.style.cssText = 'width:22px;height:22px;border-radius:50%;';
        const n = el('span', null, `${current.name} · ${kindLabel(current)}`);
        const btn = (label, fn, danger)=>{ const b = el('button', 'set-btn' + (danger ? ' danger' : ''), label); b.addEventListener('click', fn); return b; };
        box.append(img, n);
        if(current.isLocal){ box.append(btn(ACCT.active && ACCT.active.hash ? 'Password…' : 'Add password…', changePassword), btn('Delete…', deleteAccount, true)); }
        box.append(btn('Sign out', ()=>api.signOut()));
      });
    }

    const api = {
      get current(){ return current ? {...current} : null; },
      onChange(fn){ listeners.add(fn); return ()=>listeners.delete(fn); },
      whenSignedIn(){ return current ? Promise.resolve(api.current) : new Promise(res=>{ const off = api.onChange(u=>{ if(u){ off(); res(api.current); } }); }); },
      async profiles(ids){
        ids = [...new Set([].concat(ids))];
        let out = {};
        const remote = ids.filter(id=>!/^(guest_|local_)/.test(String(id)));
        if(userCap && remote.length){ try{ out = await userCap.profiles(remote); }catch(e){} }
        ids.forEach(id=>{
          const s = String(id);
          if(current && id===current.id) out[id] = {id, name:current.name, avatarUrl:current.avatarUrl, color:current.color, isMe:true};
          else if(s.indexOf('local_')===0){ const a = accounts.find(x=>'local_'+x.id===s); out[id] = a ? {id, name:a.name, avatarUrl:avatarFor(a.emoji,a.color), color:a.color, isMe:false} : {id, name:'', avatarUrl:'', color:'#888', isMe:false}; }
          else if(!out[id]) out[id] = {id, name:'', avatarUrl:'', color:'#888', isMe:false};
        });
        return out;
      },
      lock(){ if(ACCT.active && current) viewUnlock(); else { current = null; emit(); viewPick(); } },
      signOut(){
        prefs.rememberLocal = null; prefs.skip = false; savePrefs();
        try{ sessionStorage.removeItem('fauxos-session'); }catch(e){}
        if(ACCT.active){ location.reload(); return; }
        current = null; emit(); viewPick();
      },
      refreshSettings: renderSettings,
    };

    // ---- boot ----
    if(ACCT.active){ current = localUser(ACCT.active); setTimeout(emit, 0); }
    else viewPick();
    if(hasClaude){
      (async ()=>{
        try{ userCap = await window.claude.use('user'); }catch(e){ userCap = null; }
        if(userCap){ try{ viewer = await userCap.me(); }catch(e){ viewer = null; } }
        resolved = true;
        if(!current && lockEl.classList.contains('open') && !lockEl.querySelector('form')) viewPick();   // refresh the picker, unless they're mid-form
      })();
    }
    return api;
  })();

  // ---------- Background music (taskbar 🎵): original preset tracks or your own audio from My Files ----------
  const BGM_PRESETS = [
    {id:'city',    name:'Café Loops',    emoji:'☕'},
    {id:'seaside', name:'Tide Pool',     emoji:'🌊'},
    {id:'lake',    name:'Alpine Glass',  emoji:'🏔️'},
    {id:'meadow',  name:'Meadow Walk',   emoji:'🌼'},
    {id:'desert',  name:'Dune Caravan',  emoji:'🐪'},
    {id:'snow',    name:'Frost Lantern', emoji:'❄️'},
    {id:'neon',    name:'Neon Drive',    emoji:'🌃'},
    {id:'rain',    name:'Night Rain',    emoji:'🌧️'},
  ];
  function bgmHold(key, on){ bgm.hold(key, on); }
  const bgm = (function(){
    const btn = document.getElementById('bgmBtn'), panel = document.getElementById('bgmPanel');
    let st = {src:null, playing:false, vol:0.5};
    try{ st = Object.assign(st, JSON.parse(localStorage.getItem('fauxos-bgm'))||{}); }catch(e){}
    const save = ()=>{ try{ localStorage.setItem('fauxos-bgm', JSON.stringify(st)); }catch(e){} };
    const engine = makeMusicEngine(()=>st.vol);
    const holds = new Set();
    let audio = null, audioUrl = null, needsGesture = st.playing;

    function stopAll(){ engine.stop(); if(audio) audio.pause(); }
    function dataUrlToBlob(u){
      const [head, b64] = u.split(','); const mime = (head.match(/data:([^;]+)/)||[])[1] || 'audio/mpeg';
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], {type:mime});
    }
    async function loadAudio(fileId){
      if(audio && audio._fid===fileId) return true;
      if(audio){ audio.pause(); audio = null; }
      if(audioUrl){ URL.revokeObjectURL(audioUrl); audioUrl = null; }
      let items = [];
      try{ items = await fsStore.load(); }catch(e){}
      const it = items.find(x=>x.id===fileId);
      if(!it){ toast("That track isn't in My Files anymore"); st.src = null; st.playing = false; save(); render(); return false; }
      try{ audioUrl = URL.createObjectURL(dataUrlToBlob(it.content)); audio = new Audio(audioUrl); }
      catch(e){ audio = new Audio(it.content); }
      audio.loop = true; audio._fid = fileId;
      return true;
    }
    async function apply(){
      if(!st.playing || !st.src || holds.size){ stopAll(); render(); return; }
      if(st.src.type==='preset'){ if(audio) audio.pause(); engine.start(st.src.id); engine.setVolume(st.vol); }
      else {
        engine.stop();
        if(!(await loadAudio(st.src.id))) return;
        audio.volume = st.vol;
        try{ await audio.play(); }
        catch(e){ st.playing = false; save(); toast("Couldn't play that track in this browser"); }
      }
      render();
    }
    function choose(src){
      st.src = src; st.playing = true; needsGesture = false; save();
      apply(); toast(`🎵 Now playing: ${src.name}`);
    }
    function render(){
      const active = st.playing && st.src && !holds.size && !needsGesture;
      btn.classList.toggle('playing', !!active);
      btn.title = st.src ? `Background music: ${st.src.name}` : 'Background music';
      if(!panel.classList.contains('open')) return;
      panel.innerHTML = `
        <div class="bgm-head">🎵 Background music</div>
        <div class="bgm-now">${st.src ? esc(st.src.name) : '<span style="color:#9aa0ad;">Nothing selected</span>'}
          ${holds.size ? '<div class="bgm-note">Paused while Oasis is playing its own music</div>' : ''}</div>
        <div class="bgm-ctrl">
          <button class="bgm-toggle" ${st.src?'':'disabled'}>${st.playing ? '⏸ Pause' : '▶ Play'}</button>
          <label>🔊 <input class="bgm-vol" type="range" min="0" max="100" value="${Math.round(st.vol*100)}"></label>
        </div>
        <div class="bgm-sec">Presets</div>
        <div class="bgm-list">${BGM_PRESETS.map(p=>`<button class="bgm-item ${st.src&&st.src.type==='preset'&&st.src.id===p.id?'active':''}" data-preset="${p.id}">${p.emoji} ${p.name}</button>`).join('')}</div>
        <div class="bgm-sec">Your tracks</div>
        <div class="bgm-files"><span class="bgm-note">Loading…</span></div>`;
      panel.querySelector('.bgm-toggle').addEventListener('click', ()=>{ st.playing = !st.playing; needsGesture = false; save(); apply(); });
      panel.querySelector('.bgm-vol').addEventListener('input', e=>{
        st.vol = e.target.value/100; save(); engine.setVolume(st.vol); if(audio) audio.volume = st.vol;
      });
      panel.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click', ()=>{
        const p = BGM_PRESETS.find(x=>x.id===b.dataset.preset); choose({type:'preset', id:p.id, name:p.name});
      }));
      fsStore.load().then(items=>{
        const tracks = items.filter(x=>x.kind==='audio');
        const box = panel.querySelector('.bgm-files'); if(!box) return;
        box.innerHTML = tracks.length ? tracks.map(t=>`<button class="bgm-item ${st.src&&st.src.type==='file'&&st.src.id===t.id?'active':''}" data-file="${t.id}">🎵 ${esc(t.name)}</button>`).join('')
          : `<span class="bgm-note">Import an audio file in My Files, then right-click it → Set as background music.</span>`;
        box.querySelectorAll('[data-file]').forEach(b=>b.addEventListener('click', ()=>{
          const t = tracks.find(x=>x.id===b.dataset.file); choose({type:'file', id:t.id, name:t.name});
        }));
      }).catch(()=>{});
    }
    btn.addEventListener('click', e=>{ e.stopPropagation(); panel.classList.toggle('open'); render(); });
    panel.addEventListener('click', e=> e.stopPropagation());
    document.addEventListener('click', ()=>{ if(panel.classList.contains('open')){ panel.classList.remove('open'); } });
    // Browsers only allow sound after you interact: resume last session's music on the first click.
    document.addEventListener('pointerdown', function first(){
      document.removeEventListener('pointerdown', first, true);
      if(needsGesture && st.playing){ needsGesture = false; apply(); }
    }, true);
    render();
    return {
      playFile(item){ choose({type:'file', id:item.id, name:item.name}); },
      hold(key, on){ if(on) holds.add(key); else holds.delete(key); apply(); },
    };
  })();


  // ---------- Screenshots & screen recording (taskbar 📸) — saved to My Files › Screenshots ----------
  const capture = (function(){
    const btn = document.getElementById('capBtn'), panel = document.getElementById('capPanel');
    const REC_MAX_S = 120;           // keeps recordings small enough to store in My Files
    let rec = null;                  // {recorder, stream, chunks, start, timer}
    const stamp = ()=>{ const d = new Date(), p = n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}.${p(d.getMinutes())}.${p(d.getSeconds())}`; };
    function flash(){ const f = document.createElement('div'); f.className = 'cap-flash'; document.body.appendChild(f); setTimeout(()=>f.remove(), 450); }

    // Draws FauxOS's own page into an image: the live DOM is cloned into an SVG <foreignObject>.
    // Canvases and videos (games, Camera, Oasis…) are swapped for pictures of their current frame first.
    async function domSnapshot(){
      const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio||1);
      const body = document.body, clone = body.cloneNode(true);
      const origAll = body.querySelectorAll('*'), cloneAll = clone.querySelectorAll('*');
      const frameImg = (el, src)=>{ const r = el.getBoundingClientRect(), img = document.createElement('img'); img.src = src; img.className = el.className;
        img.setAttribute('style', (el.getAttribute('style')||'') + `;width:${r.width}px;height:${r.height}px;object-fit:${el.tagName==='VIDEO' ? (getComputedStyle(el).objectFit||'contain') : 'fill'};`); return img; };
      const swaps = [];
      origAll.forEach((o, i)=>{
        const c = cloneAll[i]; if(!c) return;
        if(o.tagName==='CANVAS'){ try{ swaps.push([c, frameImg(o, o.toDataURL())]); }catch(e){} }
        else if(o.tagName==='VIDEO' && o.readyState >= 2 && o.videoWidth){
          try{ const cv = document.createElement('canvas'); cv.width = o.videoWidth; cv.height = o.videoHeight; const g = cv.getContext('2d');
            g.filter = getComputedStyle(o).filter || 'none'; g.drawImage(o, 0, 0); const img = frameImg(o, cv.toDataURL('image/jpeg', 0.9)); img.style.filter = 'none'; swaps.push([c, img]); }catch(e){}
        }
        else if(o.tagName==='INPUT'){ if(o.type==='checkbox' || o.type==='radio'){ if(o.checked) c.setAttribute('checked',''); else c.removeAttribute('checked'); } else if(o.type!=='password' && o.type!=='file') c.setAttribute('value', o.value); else if(o.type==='password') c.setAttribute('value', '•'.repeat(o.value.length)); }
        else if(o.tagName==='TEXTAREA'){ c.textContent = o.value; }
        else if(o.tagName==='SELECT'){ [...c.options].forEach((op, k)=>{ if(k===o.selectedIndex) op.setAttribute('selected',''); else op.removeAttribute('selected'); }); }
        else if(o.tagName==='IMG' && /^blob:/.test(o.src) && o.complete && o.naturalWidth){
          try{ const cv = document.createElement('canvas'); cv.width = o.naturalWidth; cv.height = o.naturalHeight; cv.getContext('2d').drawImage(o,0,0); c.setAttribute('src', cv.toDataURL()); }catch(e){}
        }
        // keep scrolled panels (chat, file lists…) showing what's on screen
        if((o.scrollTop || o.scrollLeft) && c.childNodes.length){
          const cs = getComputedStyle(o), wrap = document.createElement('div');
          wrap.style.cssText = `display:${cs.display==='flex'?'flex':'block'};flex-direction:${cs.flexDirection};gap:${cs.gap};align-items:${cs.alignItems};transform:translate(${-o.scrollLeft}px,${-o.scrollTop}px);`;
          while(c.firstChild) wrap.appendChild(c.firstChild);
          c.appendChild(wrap); c.style.overflow = 'hidden';
        }
      });
      swaps.forEach(([c, img])=> c.replaceWith(img));
      clone.querySelectorAll('script, .fx-toast, #capPanel, .cap-flash').forEach(n=>n.remove());
      // body styles → a wrapper div that stands in for <body>
      const root = document.createElement('div');
      [...body.attributes].forEach(a=>root.setAttribute(a.name, a.value));
      root.classList.add('fx-snap-body');
      root.style.width = W+'px'; root.style.height = H+'px'; root.style.position = 'relative'; root.style.overflow = 'hidden';
      const css = [...document.querySelectorAll('style')].map(s=>s.textContent).join('\n')
        .replace(/:root/g, '.fx-snap-body').replace(/(^|[\s,{}])body(?=[\s,.:\[{#>])/g, '$1.fx-snap-body');
      const style = document.createElement('style'); style.textContent = css;
      root.appendChild(style);
      while(clone.firstChild) root.appendChild(clone.firstChild);
      root.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
      const xhtml = new XMLSerializer().serializeToString(root);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="100%" height="100%">${xhtml}</foreignObject></svg>`;
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      await img.decode();
      const cv = document.createElement('canvas'); cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
      const g = cv.getContext('2d'); g.scale(dpr, dpr);
      g.fillStyle = getComputedStyle(body).backgroundColor || '#1e3c72'; g.fillRect(0,0,W,H);
      g.drawImage(img, 0, 0, W, H);
      return await new Promise((res, rej)=>{ try{ cv.toBlob(b=> b ? res(b) : rej(new Error('empty')), 'image/png'); }catch(e){ rej(e); } });
    }
    // Fallback: one frame from the browser's own screen capture (asks permission).
    async function displayFrame(){
      const s = await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser'}, audio:false, preferCurrentTab:true, selfBrowserSurface:'include'});
      try{
        const v = document.createElement('video'); v.muted = true; v.srcObject = s; await v.play();
        await new Promise(r=>setTimeout(r, 250));
        const cv = document.createElement('canvas'); cv.width = v.videoWidth; cv.height = v.videoHeight; cv.getContext('2d').drawImage(v, 0, 0);
        return await new Promise(res=>cv.toBlob(res, 'image/png'));
      } finally { s.getTracks().forEach(t=>t.stop()); }
    }

    async function screenshot(){
      closePanel();
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));   // let the menu disappear first
      let blob = null;
      try{ blob = await domSnapshot(); }catch(e){ blob = null; }
      if(!blob){
        if(!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)){ toast("Screenshots aren't available in this browser"); return; }
        try{ blob = await displayFrame(); }catch(e){ toast(e && e.name==='NotAllowedError' ? 'Screenshot cancelled' : "Couldn't take a screenshot here"); return; }
      }
      flash();
      try{ await addToFolder('Screenshots', `Screenshot ${stamp()}.png`, 'image', blob); toast('📸 Screenshot saved to My Files › Screenshots'); }
      catch(e){ toast("Couldn't save the screenshot — storage may be full"); }
    }
    function delayedScreenshot(){
      closePanel();
      let n = 3; const badge = document.createElement('div'); badge.className = 'cap-count'; badge.textContent = n; document.body.appendChild(badge);
      const t = setInterval(()=>{ n--; if(n>0) badge.textContent = n; else { clearInterval(t); badge.remove(); screenshot(); } }, 1000);
    }

    async function startRecording(withSound){
      closePanel();
      if(rec) return;
      if(!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) || !window.MediaRecorder){ toast("Screen recording isn't available in this browser"); return; }
      let stream;
      try{
        stream = await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser', frameRate:30}, audio:!!withSound, preferCurrentTab:true, selfBrowserSurface:'include', systemAudio:'include'});
      }catch(e){
        const n = e && e.name;
        toast(n==='NotAllowedError' ? 'Recording cancelled (or blocked on this page — the downloaded FauxOS file allows it)'
          : n==='NotSupportedError' ? "This browser can't record the screen" : "Couldn't start screen recording");
        return;
      }
      const type = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
      let recorder;
      try{ recorder = new MediaRecorder(stream, type ? {mimeType:type, videoBitsPerSecond:1500000} : undefined); }
      catch(e){ stream.getTracks().forEach(t=>t.stop()); toast("Couldn't start recording"); return; }
      rec = {recorder, stream, chunks:[], start:Date.now(), timer:null};
      recorder.ondataavailable = e=>{ if(e.data && e.data.size) rec && rec.chunks.push(e.data); };
      recorder.onstop = async ()=>{
        const r = rec; rec = null; clearInterval(r.timer); r.stream.getTracks().forEach(t=>t.stop()); render();
        if(!r.chunks.length) return;
        const mime = (recorder.mimeType || 'video/webm').split(';')[0], blob = new Blob(r.chunks, {type:mime});
        try{ await addToFolder('Screenshots', `Screen Recording ${stamp()}.${/mp4/.test(mime)?'mp4':'webm'}`, 'video', blob); toast('🎥 Recording saved to My Files › Screenshots'); }
        catch(e){ toast("Couldn't save the recording — it may be too big. Try a shorter one."); }
      };
      stream.getVideoTracks().forEach(t=> t.addEventListener('ended', stopRecording));   // browser's own "Stop sharing" button
      recorder.start(1000);
      rec.timer = setInterval(()=>{ render(); if((Date.now()-rec.start)/1000 >= REC_MAX_S){ toast('⏹ Recordings stop at 2 minutes'); stopRecording(); } }, 500);
      render(); toast('🎥 Recording… click the red button on the taskbar to stop');
    }
    function stopRecording(){ if(rec && rec.recorder.state !== 'inactive') rec.recorder.stop(); }

    function render(){
      if(rec){
        const s = Math.floor((Date.now()-rec.start)/1000);
        btn.classList.add('recording'); btn.textContent = `⏺ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; btn.title = 'Stop recording';
      } else { btn.classList.remove('recording'); btn.textContent = '📸'; btn.title = 'Screenshot & screen recording'; }
    }
    function closePanel(){ panel.classList.remove('open'); }
    function openPanel(){
      panel.innerHTML = `<div class="bgm-head">📸 Capture</div>
        <button class="cap-item" data-c="shot">📸 Take a screenshot <span>Alt+Shift+S</span></button>
        <button class="cap-item" data-c="shot3">⏱ Screenshot in 3 seconds</button>
        <button class="cap-item" data-c="rec">🎥 Record the screen <span>Alt+Shift+R</span></button>
        <label class="cap-sound"><input type="checkbox" checked> Include sound in recordings</label>
        <div class="bgm-note">Saved automatically to My Files › Screenshots. Recording asks your browser for permission — pick this tab. Up to 2 minutes.</div>`;
      panel.querySelector('[data-c="shot"]').addEventListener('click', screenshot);
      panel.querySelector('[data-c="shot3"]').addEventListener('click', delayedScreenshot);
      panel.querySelector('[data-c="rec"]').addEventListener('click', ()=> startRecording(panel.querySelector('.cap-sound input').checked));
      panel.classList.add('open');
    }
    btn.addEventListener('click', e=>{ e.stopPropagation(); if(rec){ stopRecording(); return; } panel.classList.contains('open') ? closePanel() : openPanel(); });
    panel.addEventListener('click', e=>e.stopPropagation());
    document.addEventListener('click', closePanel);
    window.addEventListener('keydown', e=>{
      if(e.key==='PrintScreen'){ screenshot(); return; }
      if(e.altKey && e.shiftKey && (e.code==='KeyS' || e.key==='S' || e.key==='s')){ e.preventDefault(); screenshot(); }
      if(e.altKey && e.shiftKey && (e.code==='KeyR' || e.key==='R' || e.key==='r')){ e.preventDefault(); rec ? stopRecording() : startRecording(true); }
    });
    render();
    return {screenshot, startRecording, stopRecording, get recording(){ return !!rec; }};
  })();

})();
</script>
</body>
</html>
