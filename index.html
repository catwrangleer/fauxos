      showMsg('📷', 'Starting camera… your browser may ask for permission.');
      try{
        const dev = devices[deviceIdx];
        stream = await navigator.mediaDevices.getUserMedia({video: dev ? {deviceId:{exact:dev.deviceId}} : {width:{ideal:1280}, height:{ideal:720}}, audio:false});
        if(closed){ stopStream(); return; }
        video.srcObject = stream; await video.play().catch(()=>{});
        msg.hidden = true; shutter.disabled = false;
        try{
          devices = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
          $('[data-a="flip"]').hidden = devices.length < 2;
        }catch(e){}
      }catch(err){
        shutter.disabled = true;
        const n = err && err.name;
        if(n==='NotAllowedError' || n==='SecurityError') showMsg('🔒', "Camera access was blocked. Allow the camera for this page in your browser's site settings, then reopen Camera. (If you're viewing FauxOS inside Claude, the downloaded file may have better camera access.)");
        else if(n==='NotFoundError' || n==='OverconstrainedError') showMsg('🔌', 'No camera was found. Plug one in and reopen Camera.');
        else if(n==='NotReadableError') showMsg('⚠️', 'Your camera is busy — another app may be using it.');
        else showMsg('⚠️', "Couldn't start the camera.");
      }
    }
    function stopStream(){
      [stream, audioStream].forEach(s=>{ if(s) s.getTracks().forEach(t=>t.stop()); });
      stream = null; audioStream = null;
    }

    // Draw the current frame (with filter + mirror) to a canvas.
    function frameCanvas(canvas){
      const w = video.videoWidth || 1280, h = video.videoHeight || 720;
      if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
      const g = canvas.getContext('2d');
      g.save();
      if('filter' in g) g.filter = filterCss();
      if(prefs.mirror){ g.translate(w,0); g.scale(-1,1); }
      g.drawImage(video, 0, 0, w, h);
      g.restore();
      return canvas;
    }
    const stamp = ()=>{ const d = new Date(), p = n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}.${p(d.getMinutes())}.${p(d.getSeconds())}`; };
    function click(){
      try{ const ac = new (window.AudioContext||window.webkitAudioContext)(); const len = ac.sampleRate*0.06, b = ac.createBuffer(1,len,ac.sampleRate), d = b.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,4)*0.5; const s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(); setTimeout(()=>ac.close(), 300); }catch(e){}
    }

    async function takePhoto(){
      if(!stream) return;
      const canvas = frameCanvas(document.createElement('canvas'));
      flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); click();
      const blob = await new Promise(res=>canvas.toBlob(res, 'image/jpeg', 0.9));
      if(!blob) return;
      try{ const item = await addCameraFile(`Photo ${stamp()}.jpg`, 'image', blob); setLast({item, blob, kind:'image'}); toast('📸 Photo saved to My Files › Camera'); }
      catch(e){ toast("Couldn't save the photo — storage may be full"); }
    }

    async function startRecording(){
      if(!stream || recorder) return;
      if(!window.MediaRecorder){ toast("This browser can't record video"); return; }
      const canvas = document.createElement('canvas'); frameCanvas(canvas);
      const draw = ()=>{ frameCanvas(canvas); drawRaf = requestAnimationFrame(draw); }; draw();
      const out = canvas.captureStream(30);
      try{ audioStream = await navigator.mediaDevices.getUserMedia({audio:true}); audioStream.getAudioTracks().forEach(t=>out.addTrack(t)); }
      catch(e){ toast('🔇 Recording without sound (microphone not allowed)'); }
      const type = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
      try{ recorder = new MediaRecorder(out, type ? {mimeType:type, videoBitsPerSecond:2500000} : undefined); }
      catch(e){ cancelAnimationFrame(drawRaf); toast("Couldn't start recording"); return; }
      recChunks = [];
      recorder.ondataavailable = e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
      recorder.onstop = async ()=>{
        cancelAnimationFrame(drawRaf); clearInterval(recTimer);
        if(audioStream){ audioStream.getTracks().forEach(t=>t.stop()); audioStream = null; }
        const mime = (recorder && recorder.mimeType) || 'video/webm';
        recorder = null; recEl.classList.remove('on'); shutter.classList.remove('recording'); lockUI(false);
        if(closed || !recChunks.length) return;
        const blob = new Blob(recChunks, {type: mime.split(';')[0]});
        const ext = /mp4/.test(mime) ? 'mp4' : 'webm';
        try{ const item = await addCameraFile(`Video ${stamp()}.${ext}`, 'video', blob); setLast({item, blob, kind:'video'}); toast('🎬 Video saved to My Files › Camera'); }
        catch(e){ toast("Couldn't save the video — it may be too big for storage. Try a shorter one."); }
      };
      recorder.start(1000);
      recStart = Date.now(); recEl.classList.add('on'); shutter.classList.add('recording'); lockUI(true);
      const tick = ()=>{ const s = Math.floor((Date.now()-recStart)/1000); recTime.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} / 1:00`; if(s >= CAM_MAX_VIDEO_S) stopRecording(); };
      tick(); recTimer = setInterval(tick, 250);
    }
    function stopRecording(){ if(recorder && recorder.state !== 'inactive') recorder.stop(); }
    function lockUI(on){ container.querySelectorAll('.cam-mode, .cam-filter, [data-a="flip"], .cam-thumb').forEach(b=>b.disabled = on); }

    function trigger(){
      if(recorder){ stopRecording(); return; }
      if(countdown){ clearInterval(countdown); countdown = null; countEl.textContent = ''; return; }   // tap again to cancel the timer
      const go = ()=> prefs.mode==='video' ? startRecording() : takePhoto();
      if(!prefs.timer) return go();
      let n = prefs.timer; countEl.textContent = n;
      countdown = setInterval(()=>{ n--; if(n<=0){ clearInterval(countdown); countdown = null; countEl.textContent = ''; go(); } else countEl.textContent = n; }, 1000);
    }

    function setLast(l){
      last = l;
      thumb.innerHTML = '';
      if(l.kind==='image'){ const i = document.createElement('img'); i.src = l.item.content; thumb.appendChild(i); }
      else { const v = document.createElement('video'); v.src = l.item.content; v.muted = true; thumb.appendChild(v); const b = document.createElement('span'); b.className = 'cam-thumb-badge'; b.textContent = '▶'; thumb.appendChild(b); }
    }
    function openReview(){
      if(!last) return;
      reviewMedia.innerHTML = '';
      const m = document.createElement(last.kind==='image' ? 'img' : 'video');
      m.src = last.item.content; if(last.kind==='video'){ m.controls = true; m.autoplay = true; }
      reviewMedia.appendChild(m);
      $('.cam-review-name').textContent = last.item.name;
      $('[data-r="wallpaper"]').hidden = last.kind!=='image';
      review.hidden = false;
    }
    function closeReview(){ const v = reviewMedia.querySelector('video'); if(v) v.pause(); review.hidden = true; }
    thumb.addEventListener('click', openReview);
    $('[data-r="close"]').addEventListener('click', closeReview);
    $('[data-r="download"]').addEventListener('click', ()=>{ if(last) saveBlobToDevice(last.blob, last.item.name); });
    $('[data-r="wallpaper"]').addEventListener('click', ()=>{ if(last && last.kind==='image'){ setWallpaperFromFile(last.item); toast('🖼️ Wallpaper set'); } });
    $('[data-r="delete"]').addEventListener('click', async ()=>{
      if(!last) return;
      try{ const items = await fsStore.load(); await fsStore.save(items.filter(x=>x.id!==last.item.id)); document.dispatchEvent(new CustomEvent('fauxos-files-changed')); }catch(e){}
      last = null; thumb.innerHTML = ''; closeReview(); toast('Deleted');
    });

    shutter.addEventListener('click', trigger);
    container.querySelectorAll('.cam-mode').forEach(b=>b.addEventListener('click', ()=>{ prefs.mode = b.dataset.m; savePrefs(); applyView(); }));
    container.querySelectorAll('.cam-filter').forEach(b=>b.addEventListener('click', ()=>{ prefs.filter = b.dataset.f; savePrefs(); applyView(); }));
    $('[data-a="mirror"]').addEventListener('click', ()=>{ prefs.mirror = !prefs.mirror; savePrefs(); applyView(); });
    $('[data-a="timer"]').addEventListener('click', ()=>{ prefs.timer = prefs.timer===0 ? 3 : prefs.timer===3 ? 10 : 0; savePrefs(); applyView(); });
    $('[data-a="flip"]').addEventListener('click', ()=>{ if(devices.length > 1){ deviceIdx = (deviceIdx+1) % devices.length; start(); } });
    // Space / Enter take a photo or start/stop recording while Camera is the front window
    const onKey = e=>{
      if(activeWin!==myWin || isTypingTarget(e.target) || !review.hidden) return;
      if(e.key===' ' || e.key==='Enter'){ e.preventDefault(); if(!shutter.disabled) trigger(); }
    };
    window.addEventListener('keydown', onKey);
    onWindowClose(container, ()=>{
      closed = true; window.removeEventListener('keydown', onKey);
      clearInterval(countdown); clearInterval(recTimer); cancelAnimationFrame(drawRaf);
      if(recorder && recorder.state !== 'inactive'){ recorder.onstop = null; recorder.stop(); }
      stopStream();
    });
    applyView();
    start();
  }

  // ---------- Blockwild (original 3D voxel sandbox: WebGL, no libraries) ----------
  let blockwildPending = null;   // a save file waiting to be opened (from My Files)
  function openBlockwildSave(item){
    if(!installedGames.includes('blockwild')) installGame('blockwild');
    blockwildPending = item;
    if(openWindows['blockwild']){ openApp('blockwild'); document.dispatchEvent(new CustomEvent('blockwild-load')); }

      try{ return (await fsStore.load()).filter(x=>x.type==='file' && /\.blockwild\.json$/i.test(x.name)); }catch(e){ return []; }
    }

    // ---- camera math ----
    function perspective(fov, asp, n, f){ const t = 1/Math.tan(fov/2); return [t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]; }
    function mul(a,b){ const o = new Array(16); for(let c=0;c<4;c++) for(let r=0;r<4;r++){ let s = 0; for(let k=0;k<4;k++) s += a[k*4+r]*b[c*4+k]; o[c*4+r] = s; } return o; }
    function lookDir(){ const cp = Math.cos(P.pitch); return [-Math.sin(P.yaw)*cp, Math.sin(P.pitch), -Math.cos(P.yaw)*cp]; }
    function viewMatrix(eye){
      const f = lookDir(), zx = -f[0], zy = -f[1], zz = -f[2];
      let xx = zz, xy = 0, xz = -zx; const xl = Math.hypot(xx,xz)||1; xx/=xl; xz/=xl;   // x = up × z
      const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
      return [xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0, -(xx*eye[0]+xy*eye[1]+xz*eye[2]), -(yx*eye[0]+yy*eye[1]+yz*eye[2]), -(zx*eye[0]+zy*eye[1]+zz*eye[2]), 1];
    }

    // ---- raycasts ----
    function raycast(o, d, max){
      let x = Math.floor(o[0]), y = Math.floor(o[1]), z = Math.floor(o[2]);
      const sx = Math.sign(d[0]), sy = Math.sign(d[1]), sz = Math.sign(d[2]);
      const dx = Math.abs(1/d[0]), dy = Math.abs(1/d[1]), dz = Math.abs(1/d[2]);
      let tx = d[0] ? (sx>0 ? x+1-o[0] : o[0]-x)*dx : Infinity, ty = d[1] ? (sy>0 ? y+1-o[1] : o[1]-y)*dy : Infinity, tz = d[2] ? (sz>0 ? z+1-o[2] : o[2]-z)*dz : Infinity;
      let prev = null, t = 0;
      while(t <= max){
        const b = get(x,y,z);
        if(b && b!==8) return {x,y,z,prev,t,id:b};
        prev = [x,y,z];
        if(tx < ty && tx < tz){ x += sx; t = tx; tx += dx; } else if(ty < tz){ y += sy; t = ty; ty += dy; } else { z += sz; t = tz; tz += dz; }
      }
      return null;
    }
    function rayBox(o, d, min, max){
      let t0 = 0, t1 = Infinity;
      for(let i=0;i<3;i++){ if(Math.abs(d[i]) < 1e-9){ if(o[i]<min[i]||o[i]>max[i]) return null; continue; }
        let a = (min[i]-o[i])/d[i], b = (max[i]-o[i])/d[i]; if(a>b) [a,b] = [b,a]; t0 = Math.max(t0,a); t1 = Math.min(t1,b); if(t0>t1) return null; }
      return t0;
    }

    // ---- physics ----
    function boxHits(x,y,z,w,h){
      for(let bx=Math.floor(x-w/2); bx<=Math.floor(x+w/2-1e-4); bx++) for(let by=Math.floor(y); by<=Math.floor(y+h-1e-4); by++) for(let bz=Math.floor(z-w/2); bz<=Math.floor(z+w/2-1e-4); bz++) if(solidAt(bx,by,bz)) return true;
      return false;
    }
    function moveEntity(e, w, h, dt){
      e.onGround = false; let hitSide = false;
      e.x += e.vx*dt; if(boxHits(e.x,e.y,e.z,w,h)){ e.x -= e.vx*dt; e.vx = 0; hitSide = true; }
      e.z += e.vz*dt; if(boxHits(e.x,e.y,e.z,w,h)){ e.z -= e.vz*dt; e.vz = 0; hitSide = true; }
      e.y += e.vy*dt; if(boxHits(e.x,e.y,e.z,w,h)){ e.y -= e.vy*dt; if(e.vy < 0){ e.onGround = true; e.y = Math.ceil(e.y - 1e-3) > e.y ? e.y : e.y; } e.vy = 0; }
      return hitSide;
    }
    const inWater = e=> get(Math.floor(e.x), Math.floor(e.y+0.6), Math.floor(e.z))===8;

    // ---- sounds ----
    let ac = null;
    function sfx(kind){
      try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); const t = ac.currentTime;
        const g = ac.createGain(); g.connect(ac.destination);
        if(kind==='hit' || kind==='hurt'){ const o = ac.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(kind==='hurt'?180:320, t); o.frequency.exponentialRampToValueAtTime(kind==='hurt'?80:140, t+.12); g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+.15); o.connect(g); o.start(t); o.stop(t+.16); return; }
        const len = ac.sampleRate*.08, b = ac.createBuffer(1,len,ac.sampleRate), d = b.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, kind==='place'?6:2);
        const s = ac.createBufferSource(); s.buffer = b; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = kind==='place' ? 900 : 1800;
        g.gain.value = .25; s.connect(f); f.connect(g); s.start(t);
      }catch(e){}
    }

    function clockStr(){ const m = Math.floor(dayT*1440), hh = Math.floor(m/60); return `${(hh%12)||12}:${String(m%60).padStart(2,'0')} ${hh<12?'AM':'PM'}`; }

    // ---- menus ----

    async function loadMenu(){
      showMenu(`${title}<h2>Load world</h2><div class="bw-saves"><p class="bw-sub">Looking in My Files…</p></div>
        <button class="bw-btn" data-a="import">⬆️ Import a save file</button><input type="file" accept=".json,application/json" hidden>

        b.onclick = ()=>{ try{ loadSave(info); }catch(e){ toast("That save file couldn't be read"); } };

    function helpMenu(back){

    function pauseMenu(){

    function inventoryMenu(){
      paused = true; releaseMouse();
      const surv = world.mode==='survival';
      showMenu(`<h2>${surv ? 'Your blocks' : 'All blocks'}</h2><p class="bw-sub">Click a block to put it in hotbar slot ${sel+1}.</p>
        <div class="bw-grid">${PLACEABLE.map(id=>`<button class="bw-cell${surv && !inv[id] ? ' empty' : ''}" data-id="${id}" title="${B[id].name}"><div class="bw-icon" style="${iconCss(id)}"></div>${surv ? `<span class="bw-count">${inv[id]||0}</span>` : ''}<span class="bw-cell-name">${B[id].name}</span></button>`).join('')}</div>
        <button class="bw-btn primary" data-a="done">Done</button>`, m=>{

    function deathMenu(){

      showMenu(`<div class="bw-logo" style="color:#ff8a8a;">You were overwhelmed</div><p class="bw-sub">The Gloomlings got you. Your blocks are safe.</p>
        <button class="bw-btn primary" data-a="respawn">Respawn</button>`, m=>{

    function startGame(){ running = true; hud.hidden = false; renderHotbar(); renderHearts(); resume(); }
    function resume(){ hideMenu(); paused = false; hud.hidden = false; canvas.focus({preventScroll:true}); captureMouse(); }

    // ---- mouse capture (pointer lock, with a drag-to-look fallback) ----
    let locked = false, dragLook = false, dragging = null;
    // The camera locks to the mouse (pointer lock) until Esc, which opens the menu.
    // Browsers briefly refuse to re-lock right after Esc, so a refusal just asks for another click;
    // drag-to-look is only a last resort when locking keeps failing (e.g. a page that forbids it).
    let lockFailures = 0;
    function setHint(){
      const h = hudEl('.bw-hint');
      if(locked || paused || !running){ h.classList.remove('on'); return; }
      h.textContent = dragLook ? 'Drag to look · Click to break · Right-click to place · Esc for menu' : 'Click to lock the mouse · Esc for menu';
      h.classList.add('on');
    }
    function useDragLook(){ if(!dragLook){ dragLook = true; setHint(); } }
    function lockFailed(){ lockFailures++; if(lockFailures >= 3) useDragLook(); else setHint(); }
    function captureMouse(){
      if(locked) return;
      if(!canvas.requestPointerLock){ useDragLook(); return; }
      try{
        const p = canvas.requestPointerLock({unadjustedMovement:false});
        if(p && p.catch) p.catch(lockFailed);
      }catch(e){ lockFailed(); }
      setHint();
    }
    function releaseMouse(){ if(document.pointerLockElement===canvas) document.exitPointerLock(); }
    const onLockChange = ()=>{
      locked = document.pointerLockElement === canvas;
      if(locked){ lockFailures = 0; dragLook = false; }
      if(!locked && running && !paused && !dead) pauseMenu();   // Esc released the mouse → menu
      setHint();
    };
    const onLockError = ()=> lockFailed();
    document.addEventListener('pointerlockchange', onLockChange); document.addEventListener('pointerlockerror', onLockError);
    const look = (dx, dy)=>{ P.yaw -= dx*0.0025; P.pitch = Math.max(-1.55, Math.min(1.55, P.pitch - dy*0.0025)); };
    const onMouseMove = e=>{ if(!running || paused) return; if(locked) look(e.movementX, e.movementY); else if(dragLook && dragging){ look(e.clientX-dragging.x, e.clientY-dragging.y); dragging.moved += Math.abs(e.clientX-dragging.x)+Math.abs(e.clientY-dragging.y); dragging.x = e.clientX; dragging.y = e.clientY; } };
    document.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mousedown', e=>{
      if(!running || paused) return;
      if(!locked){ captureMouse(); if(!dragLook) return; }   // first click locks the mouse; in drag mode it also acts
      if(dragLook && e.button===0){ dragging = {x:e.clientX, y:e.clientY, moved:0}; }
      mouseDown[e.button] = true;
      if(e.button===0) primaryPress();
      if(e.button===2) placeBlock();
      e.preventDefault();
    });
    const onMouseUp = e=>{ mouseDown[e.button] = false; if(e.button===0){ breakT = 0; breakTarget = null; dragging = null; } };
    window.addEventListener('mouseup', onMouseUp);
    canvas.addEventListener('contextmenu', e=>e.preventDefault());
    canvas.addEventListener('wheel', e=>{ if(!running || paused) return; e.preventDefault(); sel = (sel + (e.deltaY>0?1:-1) + 9) % 9; renderHotbar(); flashMsg(B[hotbar[sel]].name); }, {passive:false});
    const onKey = (e, down)=>{
      if(activeWin!==myWin || isTypingTarget(e.target)) return;
      if(!running || !world) return;
      const k = e.code;
      if(down && !paused){
        if(/^Digit[1-9]$/.test(k)){ sel = +k.slice(5)-1; renderHotbar(); flashMsg(B[hotbar[sel]].name); }
        if(k==='KeyE'){ inventoryMenu(); }
        if(k==='KeyF' && world.mode==='creative'){ P.fly = !P.fly; P.vy = 0; flashMsg(P.fly ? 'Flying' : 'Walking'); }
        if(k==='Escape'){ pauseMenu(); }
      } else if(down && paused && k==='Escape' && !dead && menu.querySelector('[data-a=resume],[data-a=done]')){ resume(); }
      if(['KeyW','KeyA','KeyS','KeyD','Space','ShiftLeft','ShiftRight','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){ keys[k] = down; if(!paused) e.preventDefault(); }
    };
    const kd = e=>onKey(e,true), ku = e=>onKey(e,false);
    window.addEventListener('keydown', kd); window.addEventListener('keyup', ku);
    const onBlur = ()=>{ for(const k in keys) keys[k] = false; mouseDown = [false,false,false]; };
    window.addEventListener('blur', onBlur);

    // ---- actions ----
    const eye = ()=>[P.x, P.y+1.62, P.z];
    function primaryPress(){
      swing();
      // hit a Gloomling first if one is in reach and in front of any block
      const o = eye(), d = lookDir(), blk = raycast(o, d, REACH);
      let best = null;
      mobs.forEach(m=>{ const t = rayBox(o, d, [m.x-.45, m.y, m.z-.45], [m.x+.45, m.y+.9, m.z+.45]); if(t!=null && t < 3.5 && (!best || t < best.t)) best = {m, t}; });
      if(best && (!blk || best.t < blk.t) && attackCd <= 0){
        const m = best.m; m.hp -= 5; m.hurtT = .25; attackCd = .35; sfx('hit');
        const kx = m.x-P.x, kz = m.z-P.z, kl = Math.hypot(kx,kz)||1; m.vx = kx/kl*7; m.vz = kz/kl*7; m.vy = 5;
        if(m.hp <= 0){ m.dead = true; kills++; flashMsg('Gloomling banished ✨'); }
        breakTarget = null; return;
      }
      if(world.mode==='creative' && blk) breakBlock(blk);
    }
    function breakBlock(h){
      const b = B[h.id]; if(!b || b.hard===Infinity) return;
      setBlock(h.x, h.y, h.z, 0); sfx('break'); swing();
      if(world.mode==='survival' && b.drop){ inv[b.drop] = (inv[b.drop]||0) + 1; if(!hotbar.includes(b.drop)){ const empty = hotbar.findIndex(id=>!inv[id]); if(empty>-1) hotbar[empty] = b.drop; } renderHotbar(); }
    }
    function placeBlock(){
      const id = hotbar[sel];
      if(world.mode==='survival' && !inv[id]){ flashMsg(`No ${B[id].name} left`); return; }
      const h = raycast(eye(), lookDir(), REACH); if(!h || !h.prev) return;
      const [x,y,z] = h.prev; if(!inside(x,y,z)) return;
      const cur = get(x,y,z); if(cur && cur!==8) return;
      // not inside the player or a Gloomling
      const overlaps = (ex,ey,ez,w,hh)=> x+1 > ex-w/2 && x < ex+w/2 && y+1 > ey && y < ey+hh && z+1 > ez-w/2 && z < ez+w/2;
      if(B[id].solid && (overlaps(P.x,P.y,P.z,.6,1.8) || mobs.some(m=>overlaps(m.x,m.y,m.z,.9,.9)))) return;
      setBlock(x,y,z,id); sfx('place'); placeCd = .2; swing();
      if(world.mode==='survival'){ inv[id]--; renderHotbar(); }
    }

    // ---- Gloomlings ----
    function light(){ const s = Math.sin((dayT-0.25)*Math.PI*2); return 0.22 + 0.78*Math.max(0, Math.min(1, (s+0.12)/0.4)); }
    function spawnMob(){
      for(let tries=0; tries<8; tries++){
        const a = Math.random()*Math.PI*2, dist = 16 + Math.random()*12;
        const x = Math.floor(P.x + Math.cos(a)*dist), z = Math.floor(P.z + Math.sin(a)*dist);
        if(x<1||z<1||x>=W-1||z>=D-1) continue;
        const y = surfaceY(x,z); if(y < WATER || get(x,y+1,z)===8) continue;
        mobs.push({x:x+.5, y:y+1, z:z+.5, vx:0, vy:0, vz:0, hp:15, hurtT:0, cd:1, fade:0, bob:Math.random()*6}); return;
      }
    }
    function updateMobs(dt, lt){
      for(let i=mobs.length-1;i>=0;i--){
        const m = mobs[i];
        if(m.dead){ m.fade += dt*3; if(m.fade >= 1) mobs.splice(i,1); continue; }

    function hurt(n, from){

    // ---- per-frame ----

  // ---------- Clipcast (shared videos: posts, likes & comments live in `db`; video bytes in `assets` or db chunks) ----------
  // Storage (every person writes only their own documents — enforced by the access rules):
  //   vmeta/<uid>                 {vids:{<vid>:{title, desc, created, dur, size, mime, thumb, src}}}   (their uploads)
  //   vidc/<uid>/v/<vid>_<i>      {vid, i, d}   base64 pieces of a video, when it isn't stored as an asset

  let clipcastPending = null;
  function openClipcastUpload(item){

  const CC_CHUNK = 180000, CC_MAX_DB = 8*1024*1024, CC_MAX_ASSET = 20*1024*1024, CC_MAX_PER_USER = 30, CC_KEEP_COMMENTS = 300;
  function buildClipcast(container){

    const $ = s=>container.querySelector(s), main = $('.cc-main'), banner = $('.cc-banner'), search = $('.cc-search');

    let meta = {}, reacts = {}, comms = {};
    const unsubs = [], blobUrls = {};

    const dur = s=> !isFinite(s) || !s ? '' : `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
    const el = (tag, cls, text)=>{ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; };

    // ---- data views ----
    function allVideos(){

        Object.keys(vids).forEach(id=>{ const v = vids[id]; if(v && typeof v.title==='string' && v.src) out.push(Object.assign({}, v, {owner, id, key: owner+':'+id})); }); });

    function votes(key){

      Object.keys(reacts).forEach(uid=>{ const v = reacts[uid] && reacts[uid].votes && reacts[uid].votes[key]; if(v===1) up++; else if(v===-1) down++; if(me && uid===me.id) mine = v||0; });

        Object.keys(c).forEach(id=>{ const x = c[id]; if(x && x.v===key && !x.del && typeof x.t==='string' && x.t) out.push({id, by:uid, t:x.t.slice(0,2000), at:+x.at||0}); }); });

          const grab = ()=>{ try{ const c = document.createElement('canvas'); c.width = 320; c.height = 180; const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0,0,320,180);
            const r = Math.min(320/v.videoWidth, 180/v.videoHeight), w = v.videoWidth*r, h = v.videoHeight*r; g.drawImage(v, (320-w)/2, (180-h)/2, w, h);
            finish(c.toDataURL('image/jpeg', 0.6), isFinite(d) ? d : v.duration); }catch(e){ finish('', d); } };
          if(!isFinite(d)){ v.currentTime = 1e7; v.ontimeupdate = ()=>{ v.ontimeupdate = null; d = v.duration; v.currentTime = Math.min(0.5, (d||1)/3); v.onseeked = grab; }; }

        };
        v.onerror = ()=>finish('', 0);
      });
    }

    async function choose(blob, name){

    async function publish(){

      const mime = /mp4/.test(pick.blob.type) ? 'video/mp4' : /webm/.test(pick.blob.type) ? 'video/webm' : pick.blob.type || 'video/webm';
      const useAsset = assets && pick.blob.size <= CC_MAX_ASSET && (mime==='video/mp4' || mime==='video/webm');
      if(!useAsset && pick.blob.size > CC_MAX_DB){ err.textContent = `Videos can be up to ${CC_MAX_DB/1048576} MB here. Try a shorter one.`; return; }
      btn.disabled = true; btn.textContent = 'Uploading…'; bar.hidden = false; fill.style.width = '3%';

        } else {

          const n = Math.ceil(b64.length / CC_CHUNK);

            await db.doc(`vidc/${me.id}/v/${vid}_${i}`).set({vid, i, d:b64.slice(i*CC_CHUNK, (i+1)*CC_CHUNK)});
            fill.style.width = Math.round(5 + 85*(i+1)/n) + '%';
          }
          src = {type:'chunks', n};
        }
        await upsert(db.doc(`vmeta/${me.id}`), {vids:{[vid]:{title, desc, created:Date.now(), dur:pick.dur||0, size:pick.blob.size, mime, thumb:pick.thumb||'', src}}});

        btn.disabled = false; btn.textContent = 'Publish'; bar.hidden = true;
        const c = e && e.code;
        err.textContent = c==='too_large' ? 'That video is too big.' : c==='unsupported_type' ? 'Only MP4 and WebM videos can be shared.' : (c==='quota_exceeded' || c==='quota_or_state') ? 'Clipcast storage is full. Delete some old videos first.' : c==='invalid_argument' ? "Your access doesn't allow uploading here." : "The upload didn't finish. Check your connection and try again.";
      }
    }

    document.addEventListener('clipcast-upload', onUploadReq);
    onWindowClose(container, ()=>{ closed = true; document.removeEventListener('clipcast-upload', onUploadReq); unsubs.forEach(u=>{ try{ u(); }catch(e){} }); Object.values(blobUrls).forEach(u=>URL.revokeObjectURL(u)); });

    // ---- start ----
    (async ()=>{
      me = await FauxAuth.whenSignedIn();
      const has = window.claude && window.claude.use;
      try{ db = has ? await window.claude.use('db') : null; }catch(e){ db = null; }

      const sub = (path, set)=> unsubs.push(db.collection(path).onSnapshot(snap=>{ const o = {}; snap.docs.forEach(d=>{ if(d.exists) o[d.id] = d.data(); }); set(o); render(); },
        e=>showBanner(e && e.code==='revoked' ? 'Clipcast is no longer available in this view.' : "Couldn't load Clipcast right now.", true)));
      sub('vmeta', o=>meta = o); sub('vreact', o=>reacts = o); sub('vcomm', o=>comms = o);
      if(clipcastPending) nav('upload'); else nav('home');
    })();
  }

  // ---------- Oasis (ambient scenes with a day/night cycle and generative music) ----------
  function buildOasis(container){
    const SCENES = [
      {id:'meadow',   name:'Meadow',        emoji:'🌼'},
      {id:'seaside',  name:'Seaside',       emoji:'🏝️'},
      {id:'lake',     name:'Mountain Lake', emoji:'🏔️'},
      {id:'desert',   name:'Desert',        emoji:'🏜️'},
      {id:'city',     name:'City',          emoji:'🌆'},
      {id:'snow',     name:'Snowy Pines',   emoji:'🌲'},
    ];
    const SPEEDS = [
      {id:'real', label:'Real clock'}, {id:'600', label:'10 min day'},
      {id:'180', label:'3 min day'},   {id:'60', label:'1 min day'},
    ];
    container.innerHTML = `<div class="oa-wrap">
      <div class="oa-scenes">${SCENES.map(s=>`<button class="oa-scene" data-s="${s.id}">${s.emoji} ${s.name}</button>`).join('')}</div>
      <canvas class="oa-canvas"></canvas>
      <div class="oa-bar">
        <button class="oa-play" title="Music">▶ Music</button>
        <label class="oa-vol">🔊 <input type="range" min="0" max="100" value="60"></label>
        <span class="oa-clock">--:--</span>
        <input class="oa-time" type="range" min="0" max="1440" value="720" title="Time of day">
        <select class="oa-speed">${SPEEDS.map(s=>`<option value="${s.id}">${s.label}</option>`).join('')}</select>
      </div>
    </div>`;
    const canvas = container.querySelector('.oa-canvas');
    const ctx = canvas.getContext('2d');
    const playBtn = container.querySelector('.oa-play');
    const volInput = container.querySelector('.oa-vol input');
    const clockEl = container.querySelector('.oa-clock');
    const timeInput = container.querySelector('.oa-time');
    const speedSel = container.querySelector('.oa-speed');
    const myWin = container.closest('.window');

    const saved = (()=>{ try{ return JSON.parse(localStorage.getItem('fauxos-oasis'))||{}; }catch(e){ return {}; } })();
    let sceneId = SCENES.some(s=>s.id===saved.scene) ? saved.scene : 'meadow';
    let speed = SPEEDS.some(s=>s.id===saved.speed) ? saved.speed : '180';
    volInput.value = saved.vol!=null ? saved.vol : 60;
    speedSel.value = speed;
    const persist = ()=>{ try{ localStorage.setItem('fauxos-oasis', JSON.stringify({scene:sceneId, speed, vol:+volInput.value})); }catch(e){} };

    // time of day: 0 = midnight, 0.25 = 6am, 0.5 = noon, 0.75 = 6pm
    let dayT = 0.3;
    const realT = ()=>{ const d = new Date(); return (d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds())/86400; };
    if(speed==='real') dayT = realT();

    // ---------- helpers ----------
    const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));
    const smooth = (a,b,x)=>{ const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
    const hex = h=>[parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    const mixA = (a,b,t)=> [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
    const rgb = (c,a)=> a==null ? `rgb(${c[0]|0},${c[1]|0},${c[2]|0})` : `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
    function seeded(seed){ return ()=>{ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
    const WARM = [255,140,80];
    let L; // lighting for the current frame
    // A scene colour: day hex → night hex, warmed at sunrise/sunset.
    function col(day, night, a){
      let c = mixA(hex(day), hex(night), L.dark);
      c = mixA(c, WARM, L.golden*0.22);
      return rgb(c, a);
    }
    function lighting(t){
      const elev = Math.sin((t-0.25)*Math.PI*2);          // sun height: -1..1
      const dark = 1 - smooth(-0.18, 0.22, elev);
      const golden = Math.exp(-Math.pow(elev/0.16, 2));
      return {t, elev, dark, golden};
    }

    let W=600, H=360, dpr=1, clock=0;
    function resize(){
      const r = canvas.getBoundingClientRect(); dpr = window.devicePixelRatio||1;
      canvas.width = Math.max(1, r.width*dpr); canvas.height = Math.max(1, r.height*dpr);
      W = r.width; H = r.height;
    }
    const ro = new ResizeObserver(resize); ro.observe(canvas);

    // ---------- shared sky pieces ----------
    const STARS = Array.from({length:140}, (_,i)=>({x:(i*0.61803)%1, y:((i*0.7548)%1)*0.7, s:(i%5===0)?1.8:1, ph:i}));
    function sky(hz){
      const nightTop=[8,12,32], nightBot=[26,34,70], dayTop=[74,144,217], dayBot=[190,226,255], gTop=[70,78,140], gBot=[255,170,100];
      let top = mixA(dayTop, nightTop, L.dark), bot = mixA(dayBot, nightBot, L.dark);
      top = mixA(top, gTop, L.golden*0.5); bot = mixA(bot, gBot, L.golden*0.75);
      const g = ctx.createLinearGradient(0,0,0,hz);
      g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
      ctx.fillStyle = g; ctx.fillRect(0,0,W,hz+2);
      ctx.fillStyle = rgb(bot); ctx.fillRect(0,hz+1,W,H-hz);
      L.skyBot = bot; L.skyTop = top; L.hz = hz;
    }
    function stars(hz){
      if(L.dark < 0.05) return;
      STARS.forEach(s=>{
        const y = s.y*hz; if(y > hz-4) return;
        ctx.fillStyle = `rgba(255,255,255,${L.dark*(0.55+0.45*Math.sin(clock*1.5+s.ph))})`;
        ctx.fillRect(s.x*W, y, s.s, s.s);
      });
    }
    function sunMoon(hz){
      const arc = (tt)=>{ const p = ((tt-0.25+1)%1)/0.5; return {x: W*(0.08 + 0.84*p), y: hz - Math.sin(p*Math.PI)*hz*0.8, up: p>=0 && p<=1}; };
      const s = arc(L.t);
      if(s.up){
        const r = 22;
        const glow = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*4);
        glow.addColorStop(0, `rgba(255,236,170,${0.6})`); glow.addColorStop(1,'rgba(255,220,150,0)');
        ctx.fillStyle = glow; ctx.fillRect(s.x-r*4, s.y-r*4, r*8, r*8);
        ctx.fillStyle = rgb(mixA([255,248,220],[255,170,90],L.golden)); ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2); ctx.fill();
      }
      L.sun = s;
      const m = arc((L.t+0.5)%1);
      if(m.up){
        ctx.fillStyle = `rgba(240,240,255,${0.35+0.65*L.dark})`; ctx.beginPath(); ctx.arc(m.x,m.y,15,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = rgb(mixA(L.skyTop, L.skyBot, clamp(m.y/hz,0,1)), 0.25+0.7*L.dark); ctx.beginPath(); ctx.arc(m.x+6,m.y-3,13,0,Math.PI*2); ctx.fill();
      }
      L.moon = m;
    }
    function clouds(hz, n, seed, alphaDay){
      const r = seeded(seed);
      for(let i=0;i<n;i++){
        const baseX = r(), y = hz*(0.12 + r()*0.4), w = 60 + r()*90, sp = 4 + r()*8;
        const x = ((baseX*(W+300) + clock*sp) % (W+300)) - 150;
        const c = mixA(mixA([255,255,255],[70,78,110],L.dark), [255,180,150], L.golden*0.6);
        ctx.fillStyle = rgb(c, alphaDay*(1-L.dark*0.5));
        for(let k=0;k<4;k++){ ctx.beginPath(); ctx.ellipse(x + k*w*0.22, y - (k%2)*8, w*0.28, 13, 0, 0, Math.PI*2); ctx.fill(); }
      }
    }
    function birds(n, seed){
      if(L.dark > 0.5) return;
      const r = seeded(seed);
      ctx.strokeStyle = `rgba(30,30,40,${0.7*(1-L.dark*2)})`; ctx.lineWidth = 1.5;
      for(let i=0;i<n;i++){
        const x = ((r()*(W+200) + clock*(18+r()*10)) % (W+200)) - 100, y = H*(0.15+r()*0.25) + Math.sin(clock*2+i)*4;
        const f = Math.sin(clock*8+i*2)*4;
        ctx.beginPath(); ctx.moveTo(x-7,y-f); ctx.quadraticCurveTo(x-3,y-2,x,y); ctx.quadraticCurveTo(x+3,y-2,x+7,y-f); ctx.stroke();
      }
    }
    function ridge(base, amp, freq, seed, color, jag){
      const r = seeded(seed), ph = r()*10;
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0,H);
      for(let x=0;x<=W+10;x+=jag?14:8){
        const y = base - amp*(0.5+0.5*Math.sin(x*freq+ph)) - (jag? amp*0.5*Math.abs(Math.sin(x*freq*2.7+ph*2)) : amp*0.25*Math.sin(x*freq*2.3+ph));
        ctx.lineTo(x,y);
      }
      ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    }
    const ridgeY = (x, base, amp, freq, seed)=>{ const ph = seeded(seed)()*10; return base - amp*(0.5+0.5*Math.sin(x*freq+ph)) - amp*0.25*Math.sin(x*freq*2.3+ph); };
    function glowDot(x,y,r,c,a){ const g = ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`); ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2); }

    // ---------- scenes ----------
    const DRAW = {
      meadow(){
        const hz = H*0.6;
        sky(hz); stars(hz); sunMoon(hz); clouds(hz, 5, 11, 0.85); birds(4, 5);
        ridge(hz+10, 50, 0.006, 1, col('#8cbf86','#1c2a2c'));
        ridge(hz+60, 45, 0.009, 2, col('#66a653','#142019'));
        // trees on the middle hill
        const r = seeded(3);
        for(let i=0;i<9;i++){
          const x = r()*W, y = ridgeY(x, hz+60, 45, 0.009, 2) + 4, s = 0.7 + r()*0.6;
          ctx.fillStyle = col('#6b4a2b','#120d0a'); ctx.fillRect(x-2*s, y-18*s, 4*s, 18*s);
          ctx.fillStyle = col('#3f7f36','#0c1a10'); ctx.beginPath(); ctx.arc(x, y-24*s, 13*s, 0, Math.PI*2); ctx.arc(x-8*s, y-17*s, 9*s, 0, Math.PI*2); ctx.arc(x+8*s, y-17*s, 9*s, 0, Math.PI*2); ctx.fill();
        }
        ridge(H-30, 40, 0.005, 4, col('#4f8f3e','#0e1912'));
        // flowers
        const fr = seeded(9), fc = ['#ff6b8a','#ffd84a','#ffffff','#b58cff'];
        for(let i=0;i<70;i++){ const x = fr()*W, y = H - fr()*55; ctx.fillStyle = col(fc[i%4], '#1a2230'); ctx.fillRect(x, y + Math.sin(clock*1.5+i)*1, 3, 3); }
        // fireflies at night
        if(L.dark > 0.3){
          for(let i=0;i<22;i++){
            const x = (i*97 + Math.sin(clock*0.3+i)*60 + W) % W, y = H*0.62 + (i*37%100)/100*H*0.33 + Math.sin(clock*0.7+i*2)*12;
            glowDot(x, y, 9, '220,255,120', (L.dark-0.3)*(0.5+0.5*Math.sin(clock*3+i*1.7)));
          }
        }
      },
      seaside(){
        const hz = H*0.55;
        sky(hz); stars(hz); sunMoon(hz); clouds(hz, 4, 21, 0.8); birds(3, 7);
        // sea
        const sea = ctx.createLinearGradient(0,hz,0,H*0.82);
        sea.addColorStop(0, rgb(mixA(L.skyBot, [20,70,110], 0.55))); sea.addColorStop(1, rgb(mixA([16,86,130],[6,14,30],L.dark)));
        ctx.fillStyle = sea; ctx.fillRect(0,hz,W,H*0.82-hz);
        // sun / moon reflection
        const src = L.sun.up && L.sun.y < hz ? {x:L.sun.x, c:'255,220,150', a:0.55} : (L.moon.up && L.moon.y < hz ? {x:L.moon.x, c:'220,225,255', a:0.35*L.dark} : null);
        if(src){ for(let y=hz+3;y<H*0.82;y+=5){ const w = 6 + (y-hz)*0.35; ctx.fillStyle = `rgba(${src.c},${src.a*(0.5+0.5*Math.sin(y*0.5+clock*3))})`; ctx.fillRect(src.x - w/2 + Math.sin(y+clock*2)*4, y, w, 2); } }
        // wave glints
        ctx.strokeStyle = rgb(mixA([255,255,255],[120,140,180],L.dark), 0.35);
        ctx.lineWidth = 1;
        for(let i=0;i<40;i++){ const y = hz + 6 + (i*13.7 % (H*0.82-hz-10)), x = ((i*73 + clock*(8+i%5)) % (W+40)) - 20; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+10+(i%4)*4, y); ctx.stroke(); }
        // beach + foam
        ctx.fillStyle = col('#e9d5a3','#2b2a36'); ctx.beginPath(); ctx.moveTo(0,H);
        for(let x=0;x<=W;x+=10) ctx.lineTo(x, H*0.8 + Math.sin(x*0.012)*6); ctx.lineTo(W,H); ctx.fill();
        ctx.strokeStyle = `rgba(255,255,255,${0.7-0.4*L.dark})`; ctx.lineWidth = 3; ctx.beginPath();
        for(let x=0;x<=W;x+=8){ const y = H*0.8 + Math.sin(x*0.012)*6 - 3 + Math.sin(clock*0.9)*4 + Math.sin(x*0.05+clock*2)*1.5; x?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke();
        // palms
        [[W*0.12, 1], [W*0.86, -1], [W*0.93, -0.8]].forEach(([px,dir],i)=>{
          const base = H*0.97, h = 120 - i*18, sway = Math.sin(clock*0.8+i)*4;
          ctx.strokeStyle = col('#7a5a3a','#141018'); ctx.lineWidth = 7 - i; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(px, base); ctx.quadraticCurveTo(px + dir*30, base - h*0.6, px + dir*18 + sway, base - h); ctx.stroke();
          const tx = px + dir*18 + sway, ty = base - h;
          ctx.strokeStyle = col('#2f8a4a','#0a1a14'); ctx.lineWidth = 4;
          for(let k=0;k<7;k++){ const a = -Math.PI + k*Math.PI/6 + Math.sin(clock+k)*0.05; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.quadraticCurveTo(tx + Math.cos(a)*30, ty + Math.sin(a)*20 - 12, tx + Math.cos(a)*50, ty + Math.sin(a)*25 + 14); ctx.stroke(); }
        });
      },
      lake(){
        const hz = H*0.58;
        sky(hz); stars(hz); sunMoon(hz); clouds(hz, 3, 31, 0.7);
        const mountains = ()=>{
          ridge(hz, 100, 0.005, 5, col('#8a97b5','#1a2036'), true);
          ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hz-104); ctx.clip();       // snow caps on the tallest peaks
          ridge(hz, 100, 0.005, 5, col('#f4f7fb','#4a5572'), true);
          ctx.restore();
          ridge(hz, 55, 0.009, 6, col('#5d6d8f','#121829'), true);
        };
        mountains();
        // lake reflects the sky and mountains
        ctx.save(); ctx.beginPath(); ctx.rect(0,hz,W,H-hz); ctx.clip();
        ctx.translate(0, hz*2); ctx.scale(1,-1); sky(hz); mountains();
        ctx.restore();
        ctx.fillStyle = rgb(mixA([30,60,90],[5,8,18],L.dark), 0.45); ctx.fillRect(0,hz,W,H-hz);
        ctx.strokeStyle = `rgba(255,255,255,${0.18})`; ctx.lineWidth = 1;
        for(let i=0;i<30;i++){ const y = hz + 4 + (i*11.3 % (H-hz-4)), x = ((i*91 + clock*5) % (W+40)) - 20; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+16,y); ctx.stroke(); }
        // pines on the shores
        const r = seeded(8);
        const pine = (x, y, h)=>{ ctx.fillStyle = col('#244d34','#060d0a'); ctx.beginPath(); for(let k=0;k<3;k++){ const ty = y - h + k*h*0.28, w = h*(0.22 + k*0.1); ctx.moveTo(x, ty); ctx.lineTo(x-w, ty + h*0.42); ctx.lineTo(x+w, ty + h*0.42); } ctx.fill(); ctx.fillRect(x-2, y-6, 4, 8); };
        for(let i=0;i<10;i++) pine(r()*W*0.25, H - r()*20, 50 + r()*50);
        for(let i=0;i<10;i++) pine(W*0.75 + r()*W*0.25, H - r()*20, 50 + r()*50);
        // morning mist
        const mist = Math.exp(-Math.pow((L.t-0.27)/0.05, 2));
        if(mist > 0.02){ const g = ctx.createLinearGradient(0,hz-30,0,hz+40); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.5,`rgba(255,245,235,${0.55*mist})`); g.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0,hz-30,W,70); }
      },
      desert(){
        const hz = H*0.62;
        sky(hz); stars(hz); sunMoon(hz); clouds(hz, 2, 41, 0.5);
        // shooting star now and then at night
        if(L.dark > 0.6){
          const cyc = (clock % 7)/7;
          if(cyc < 0.12){ const p = cyc/0.12, x = W*0.2 + p*W*0.3, y = H*0.1 + p*H*0.15; ctx.strokeStyle = `rgba(255,255,255,${1-p})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-40,y-18); ctx.stroke(); }
        }
        ridge(hz+10, 35, 0.004, 12, col('#e7b07a','#2a2238'));
        ridge(hz+55, 45, 0.006, 13, col('#d9955a','#1f1a2c'));
        // cacti
        const cactus = (x,y,s)=>{
          ctx.strokeStyle = col('#3f7a4a','#0d1612'); ctx.lineCap = 'round';
          ctx.lineWidth = 10*s; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-70*s); ctx.stroke();
          ctx.lineWidth = 7*s; ctx.beginPath(); ctx.moveTo(x,y-30*s); ctx.lineTo(x-16*s,y-30*s); ctx.lineTo(x-16*s,y-50*s);
          ctx.moveTo(x,y-40*s); ctx.lineTo(x+14*s,y-40*s); ctx.lineTo(x+14*s,y-58*s); ctx.stroke();
        };
        cactus(W*0.2, ridgeY(W*0.2, hz+55, 45, 0.006, 13)+6, 0.8);
        cactus(W*0.7, ridgeY(W*0.7, hz+55, 45, 0.006, 13)+6, 0.6);
        ridge(H-20, 40, 0.003, 14, col('#c47a44','#17131f'));
        cactus(W*0.88, H-10, 1.2);
        // drifting sand
        ctx.fillStyle = `rgba(255,230,190,${0.25*(1-L.dark)})`;
        for(let i=0;i<40;i++){ const x = ((i*53 + clock*(40+i%7*6)) % (W+20)) - 10, y = H*0.75 + (i*17%60) + Math.sin(clock*2+i)*3; ctx.fillRect(x,y,2,1); }
      },
      city(){
        const hz = H*0.72;
        sky(hz); stars(hz); sunMoon(hz); clouds(hz, 4, 51, 0.7); birds(3, 9);
        const r = seeded(17);
        // far skyline
        ctx.fillStyle = col('#8f9bb8','#1c2138');
        for(let x=0;x<W;){ const w = 20 + r()*30, h = 40 + r()*90; ctx.fillRect(x, hz-h, w, h+2); x += w; }
        // near buildings with windows
        const r2 = seeded(23);

          const w = 40 + r2()*50, h = 70 + r2()*150, seed = r2()*1000;
          ctx.fillStyle = col('#5b6680','#0f1322'); ctx.fillRect(x, hz-h, w, h+2);
          const wr = seeded(seed|0);
          for(let wy = hz-h+8; wy < hz-8; wy += 11){
            for(let wx = x+6; wx < x+w-8; wx += 9){
              const on = wr() < 0.45, flick = wr();
              if(L.dark > 0.2 && on){
                const lit = flick < 0.02 ? (Math.sin(clock*0.5+wx)>0 ? 1 : 0) : 1;
                ctx.fillStyle = `rgba(255,214,130,${(L.dark-0.2)*lit})`;
              } else ctx.fillStyle = rgb(mixA([160,190,220],[20,26,44],L.dark), 0.6);
              ctx.fillRect(wx, wy, 5, 6);
            }
          }

        for(let x=((-clock*30)%40); x<W; x+=40) ctx.fillRect(x, hz + (H-hz)/2 - 1, 20, 2);
        // street lamps
        for(let x=30;x<W;x+=120){ ctx.fillStyle = col('#2a2d35','#07080c'); ctx.fillRect(x, hz-38, 3, 40); ctx.fillRect(x, hz-38, 12, 3); if(L.dark>0.3) glowDot(x+11, hz-34, 26, '255,210,140', (L.dark-0.3)*0.8); }
        // traffic
        for(let i=0;i<8;i++){
          const dir = i%2 ? 1 : -1, sp = 50 + (i*13%30), lane = hz + (H-hz)*(dir>0 ? 0.3 : 0.72);
          const x = dir>0 ? ((i*167 + clock*sp) % (W+80)) - 40 : W + 40 - ((i*167 + clock*sp) % (W+80));
          ctx.fillStyle = col(['#d9534f','#4a8ad9','#e0c24a','#e8e8e8'][i%4], '#15171f'); ctx.fillRect(x-14, lane-5, 28, 9);

        }
      },
      snow(){
        const hz = H*0.6;
        sky(hz);
        // aurora at night
        if(L.dark > 0.4){
          for(let b=0;b<3;b++){
            ctx.fillStyle = b===1 ? `rgba(180,110,255,${(L.dark-0.4)*0.22})` : `rgba(90,255,170,${(L.dark-0.4)*0.28})`;

        ridge(hz+60, 40, 0.008, 72, col('#f2f6fb','#343e56'));
        const r = seeded(7);

          for(let k=0;k<3;k++){ const ty = y - h + k*h*0.27, w = h*(0.2 + k*0.1);
            ctx.fillStyle = col('#2a5a3e','#08120e'); ctx.beginPath(); ctx.moveTo(x,ty); ctx.lineTo(x-w,ty+h*0.4); ctx.lineTo(x+w,ty+h*0.4); ctx.fill();
            ctx.fillStyle = col('#ffffff','#5a6680'); ctx.beginPath(); ctx.moveTo(x,ty); ctx.lineTo(x-w*0.45,ty+h*0.18); ctx.lineTo(x+w*0.45,ty+h*0.18); ctx.fill(); }
        };
        for(let i=0;i<14;i++){ const x = r()*W; pine(x, ridgeY(x, hz+60, 40, 0.008, 72)+8, 40 + r()*40); }
        // cabin
        const cx = W*0.62, cy = ridgeY(W*0.62, hz+60, 40, 0.008, 72) + 20;
        ctx.fillStyle = col('#7a4b2e','#1a120e'); ctx.fillRect(cx-36, cy-34, 72, 34);
        ctx.fillStyle = col('#ffffff','#6a7590'); ctx.beginPath(); ctx.moveTo(cx-44, cy-32); ctx.lineTo(cx, cy-60); ctx.lineTo(cx+44, cy-32); ctx.fill();
        ctx.fillStyle = col('#5a3a26','#140e0b'); ctx.fillRect(cx+18, cy-62, 8, 20);
        ctx.fillStyle = L.dark > 0.3 ? `rgba(255,200,110,${0.4+0.6*L.dark})` : col('#9bbbd6','#223'); ctx.fillRect(cx-24, cy-24, 14, 12); ctx.fillRect(cx+8, cy-24, 14, 12);
        if(L.dark > 0.3) glowDot(cx, cy-18, 60, '255,190,100', (L.dark-0.3)*0.35);

        for(let k=0;k<6;k++){ const p = ((clock*0.25 + k/6) % 1); ctx.fillStyle = `rgba(220,225,235,${0.4*(1-p)})`; ctx.beginPath(); ctx.arc(cx+22 + Math.sin(p*6+clock)*6 + p*20, cy-66 - p*60, 5 + p*10, 0, Math.PI*2); ctx.fill(); }
        ridge(H-10, 30, 0.004, 73, col('#ffffff','#3d4862'));
        // snowfall
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        for(let i=0;i<90;i++){ const sp = 18 + (i%5)*8, x = ((i*71.3 + Math.sin(clock*0.5+i)*20) % W + W) % W, y = ((i*37.1 + clock*sp) % (H+10)) - 5; ctx.beginPath(); ctx.arc(x, y, 1 + (i%3)*0.6, 0, Math.PI*2); ctx.fill(); }
      },
    };

    const music = makeMusicEngine(()=>volInput.value/100);

    // ---------- UI ----------
    function selectScene(id){
      sceneId = id; persist();
      container.querySelectorAll('.oa-scene').forEach(b=>b.classList.toggle('active', b.dataset.s===id));
      if(music.on) music.start(id);
    }
    container.querySelectorAll('.oa-scene').forEach(b=>b.addEventListener('click', ()=>selectScene(b.dataset.s)));
    playBtn.addEventListener('click', ()=>{
      if(music.on){ music.stop(); playBtn.textContent = '▶ Music'; playBtn.classList.remove('on'); bgmHold('oasis', false); }
      else { bgmHold('oasis', true); music.start(sceneId); playBtn.textContent = '⏸ Music'; playBtn.classList.add('on'); }
    });
    volInput.addEventListener('input', ()=>{ music.setVolume(volInput.value/100); persist(); });
    speedSel.addEventListener('change', ()=>{ speed = speedSel.value; persist(); timeInput.disabled = speed==='real'; if(speed==='real') dayT = realT(); });
    timeInput.disabled = speed==='real';
    timeInput.addEventListener('input', ()=>{ if(speed!=='real') dayT = timeInput.value/1440; });

    let raf=null, last=0;
    function frame(ts){
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.1, (ts-last)/1000 || 0); last = ts;
      if(myWin && myWin.style.display==='none') return;
      clock += dt;
      if(speed==='real') dayT = realT(); else dayT = (dayT + dt/(+speed)) % 1;
      L = lighting(dayT);
      music.setDark(L.dark);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      DRAW[sceneId]();
      const mins = Math.floor(dayT*1440), h = Math.floor(mins/60), m = mins%60;
      clockEl.textContent = `${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
      if(document.activeElement !== timeInput) timeInput.value = mins;
    }
    onWindowClose(container, ()=>{ cancelAnimationFrame(raf); ro.disconnect(); music.close(); bgmHold('oasis', false); });
    selectScene(sceneId);
    requestAnimationFrame(ts=>{ last = ts; resize(); frame(ts); });
  }

  function aiLoadConfig(){
    try{ return JSON.parse(localStorage.getItem('fauxos-ai-config'))||{}; }catch(e){ return {}; }
  }
  function aiSaveConfig(cfg){ try{ localStorage.setItem('fauxos-ai-config', JSON.stringify(cfg)); }catch(e){} }
  async function aiCallAnthropicDirect(history, cfg){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': cfg.apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({ model: cfg.model||'claude-sonnet-5', max_tokens:1000, messages: history })
    });
    if(!res.ok){ const t = await res.text().catch(()=>''); throw new Error('API error '+res.status+': '+t.slice(0,180)); }
    const data = await res.json();
    return (data.content||[]).map(c=>c.text||'').join('\n').trim();
  }
  async function aiCallOpenAIDirect(history, cfg){
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'Authorization':'Bearer '+cfg.apiKey },
      body: JSON.stringify({ model: cfg.model||'gpt-4o', messages: history.map(m=>({role:m.role, content:m.content})) })
    });
    if(!res.ok){ const t = await res.text().catch(()=>''); throw new Error('API error '+res.status+': '+t.slice(0,180)); }
    const data = await res.json();
    return data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content.trim() : '';
  }

  }

  // ---------- Audio Editor ----------
  function aeBufferToWav(abuffer){
    const numCh = abuffer.numberOfChannels;
    const len = abuffer.length*numCh*2 + 44;
    const buf = new ArrayBuffer(len);
    const view = new DataView(buf);
    let pos = 0;
    function u16(d){ view.setUint16(pos,d,true); pos+=2; }
    function u32(d){ view.setUint32(pos,d,true); pos+=4; }
    u32(0x46464952); u32(len-8); u32(0x45564157);
    u32(0x20746d66); u32(16); u16(1); u16(numCh);
    u32(abuffer.sampleRate); u32(abuffer.sampleRate*2*numCh); u16(numCh*2); u16(16);
    u32(0x61746164); u32(len-pos-4);
    const chans = []; for(let i=0;i<numCh;i++) chans.push(abuffer.getChannelData(i));
    let offset=0;
    while(pos<len){
      for(let i=0;i<numCh;i++){
        let s = Math.max(-1,Math.min(1,chans[i][offset]));
        s = s<0 ? s*0x8000 : s*0x7FFF;
        view.setInt16(pos, s, true); pos+=2;
      }
      offset++;
    }
    return new Blob([view], {type:'audio/wav'});
  }
  function aeCrop(ctx,b,s0,s1){
    const sr=b.sampleRate, i0=Math.max(0,Math.floor(s0*sr)), i1=Math.min(b.length,Math.floor(s1*sr));
    const len=Math.max(1,i1-i0), out=ctx.createBuffer(b.numberOfChannels,len,sr);
    for(let c=0;c<b.numberOfChannels;c++) out.getChannelData(c).set(b.getChannelData(c).subarray(i0,i0+len));
    return out;
  }
  function aeReverse(ctx,b){
    const out=ctx.createBuffer(b.numberOfChannels,b.length,b.sampleRate);
    for(let c=0;c<b.numberOfChannels;c++){
      const src=b.getChannelData(c), dst=out.getChannelData(c);
      for(let i=0;i<src.length;i++) dst[i]=src[src.length-1-i];
    }
    return out;
  }
  function aeNormalize(ctx,b){
    let peak=0;
    for(let c=0;c<b.numberOfChannels;c++){ const d=b.getChannelData(c); for(let i=0;i<d.length;i++) peak=Math.max(peak,Math.abs(d[i])); }
    if(peak<1e-6||peak>=0.99) return b;
    const gain=0.98/peak, out=ctx.createBuffer(b.numberOfChannels,b.length,b.sampleRate);
    for(let c=0;c<b.numberOfChannels;c++){
      const src=b.getChannelData(c), dst=out.getChannelData(c);
      for(let i=0;i<src.length;i++) dst[i]=src[i]*gain;
    }
    return out;
  }
  function aeGain(ctx,b,g){
    const out=ctx.createBuffer(b.numberOfChannels,b.length,b.sampleRate);
    for(let c=0;c<b.numberOfChannels;c++){
      const src=b.getChannelData(c), dst=out.getChannelData(c);
      for(let i=0;i<src.length;i++) dst[i]=Math.max(-1,Math.min(1,src[i]*g));
    }
    return out;
  }
  function aeFade(ctx,b,type,durSec,sel0,sel1){
    const out=ctx.createBuffer(b.numberOfChannels,b.length,b.sampleRate), sr=b.sampleRate;
    let a,z;
    if(sel1>sel0){ a=Math.floor(sel0*sr); z=Math.floor(sel1*sr); }
    else if(type==='in'){ a=0; z=Math.min(b.length,Math.floor(durSec*sr)); }
    else { z=b.length; a=Math.max(0,b.length-Math.floor(durSec*sr)); }
    for(let c=0;c<b.numberOfChannels;c++){
      const src=b.getChannelData(c), dst=out.getChannelData(c);
      dst.set(src);
      const span=Math.max(1,z-a);
      for(let i=a;i<z;i++){ const t=(i-a)/span, g=type==='in'?t:1-t; dst[i]=src[i]*g; }
    }
    return out;
  }
  function aeEcho(ctx,b,delaySec,decay,repeats){
    const sr=b.sampleRate, dSamp=Math.floor(delaySec*sr), newLen=b.length+dSamp*repeats;
    const out=ctx.createBuffer(b.numberOfChannels,newLen,sr);
    for(let c=0;c<b.numberOfChannels;c++){
      const src=b.getChannelData(c), dst=out.getChannelData(c);
      dst.set(src);
      for(let r=1;r<=repeats;r++){
        const g=Math.pow(decay,r), off=dSamp*r;
        for(let i=0;i<src.length;i++){ const idx=i+off; if(idx<newLen) dst[idx]+=src[i]*g; }
      }
      for(let i=0;i<newLen;i++) dst[i]=Math.max(-1,Math.min(1,dst[i]));
    }
    return out;
  }
  function aeSpeed(ctx,b,rate){
    const newLen=Math.max(1,Math.floor(b.length/rate));
    const out=ctx.createBuffer(b.numberOfChannels,newLen,b.sampleRate);
    for(let c=0;c<b.numberOfChannels;c++){
      const src=b.getChannelData(c), dst=out.getChannelData(c);
      for(let i=0;i<newLen;i++){
        const p=i*rate, i0=Math.floor(p), i1=Math.min(src.length-1,i0+1), f=p-i0;
        dst[i]=src[i0]*(1-f)+src[i1]*f;
      }
    }
    return out;
  }
  async function aeFilter(b,type,freq){
    const off = new OfflineAudioContext(b.numberOfChannels,b.length,b.sampleRate);
    const src = off.createBufferSource(); src.buffer=b;
    const f = off.createBiquadFilter(); f.type=type; f.frequency.value=freq;
    if(type==='lowshelf') f.gain.value=12;
    src.connect(f); f.connect(off.destination); src.start();
    return await off.startRendering();
  }

    function resizeCanvas(){
      const r = canvas.getBoundingClientRect();

    function drawWave(){
      if(!buffer) return;
      const w=canvas.width, h=canvas.height, cctx=canvas.getContext('2d');
      cctx.fillStyle='#101418'; cctx.fillRect(0,0,w,h);
      const data = buffer.getChannelData(0);
      const step = Math.max(1, Math.floor(data.length/w));
      cctx.strokeStyle='#3ecf6b'; cctx.beginPath();
      const mid=h/2;
      for(let x=0;x<w;x++){
        let min=1,max=-1;
        const start=x*step, end=Math.min(data.length,start+step);
        for(let i=start;i<end;i++){ const v=data[i]; if(v<min)min=v; if(v>max)max=v; }
        cctx.moveTo(x, mid+min*mid*0.95);
        cctx.lineTo(x, mid+max*mid*0.95);
      }
      cctx.stroke();
      if(selEnd>selStart){
        const x0 = (selStart/buffer.duration)*w, x1=(selEnd/buffer.duration)*w;
        cctx.fillStyle='rgba(59,130,246,.28)'; cctx.fillRect(x0,0,x1-x0,h);
        cctx.strokeStyle='#3b82f6'; cctx.beginPath(); cctx.moveTo(x0,0); cctx.lineTo(x0,h); cctx.moveTo(x1,0); cctx.lineTo(x1,h); cctx.stroke();
      }

      const sel = selEnd>selStart ? ` — selection ${fmt(selStart)}–${fmt(selEnd)}` : '';
      timeEl.textContent = buffer ? `${fmt(buffer.duration)} total${sel}` : '';
    }

    let dragging=false;
    function xToTime(clientX){
      const r = canvas.getBoundingClientRect();
      const x = Math.max(0,Math.min(r.width, clientX-r.left));
      return (x/r.width)*(buffer?buffer.duration:0);
    }

    window.addEventListener('mousemove', e=>{ if(!dragging) return; selEnd=xToTime(e.clientX); drawWave(); updateTime(); });
    window.addEventListener('mouseup', ()=>{

  // ---------- Tic Tac Toe ----------
  function buildTicTacToe(container){
    container.innerHTML = `<div class="app-pad game-wrap">
      <div class="ttt-status">Your turn (X)</div>
      <div class="ttt-board"></div>
      <button class="game-reset">Restart</button>
    </div>`;
    const board = container.querySelector('.ttt-board');
    const status = container.querySelector('.ttt-status');
    let cells = Array(9).fill(null);
    let over = false;
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function winner(b){
      for(const [a,c,d] of lines){ if(b[a] && b[a]===b[c] && b[a]===b[d]) return b[a]; }
      return b.every(x=>x) ? 'draw' : null;
    }
    // Computer: take a win, block yours, then center > corners > edges (with a small chance to slip up).
    function computerMove(){
      const empty = cells.map((c,idx)=>c?null:idx).filter(x=>x!==null);
      if(!empty.length) return null;
      const completes = (mark)=> empty.find(i=>{ const b=cells.slice(); b[i]=mark; return winner(b)===mark; });
      const win = completes('O'); if(win!==undefined) return win;
      const block = completes('X'); if(block!==undefined && Math.random()>0.1) return block;
      const prefs = [4,0,2,6,8,1,3,5,7].filter(i=>empty.includes(i));
      if(Math.random()<0.15) return empty[Math.floor(Math.random()*empty.length)];
      return prefs[0];
    }
    function render(){
      board.innerHTML = cells.map((c,i)=>`<button class="ttt-cell" data-i="${i}" ${c?'disabled':''}>${c||''}</button>`).join('');
      board.querySelectorAll('.ttt-cell').forEach(btn=>btn.addEventListener('click', onMove));
    }
    function onMove(e){
      if(over) return;
      const i = +e.target.dataset.i;
      if(cells[i]) return;
      cells[i]='X';
      let w = winner(cells);
      if(!w){
        const pick = computerMove();
        if(pick!=null){ cells[pick]='O'; w = winner(cells); }
      }
      render();
      if(w){
        over = true;
        status.textContent = w==='draw' ? "It's a draw!" : (w==='X' ? 'You win! 🎉' : 'Computer wins!');
      } else {
        status.textContent = 'Your turn (X)';
      }
    }
    container.querySelector('.game-reset').addEventListener('click', ()=>{
      cells = Array(9).fill(null); over=false; status.textContent='Your turn (X)'; render();
    });
    render();
  }

  // ---------- Memory Match ----------
  function buildMemory(container){
    container.innerHTML = `<div class="app-pad game-wrap">
      <div class="mem-status">Moves: 0</div>
      <div class="mem-board"></div>
      <button class="game-reset">Restart</button>
    </div>`;
    const board = container.querySelector('.mem-board');
    const status = container.querySelector('.mem-status');
    const set = ['🍎','🍌','🍇','🍉','🍓','🍒'];
    let cards, flipped, matched, moves, lock;
    function setup(){
      cards = [...set,...set].map((v,i)=>({v,id:i,open:false,done:false}));
      cards.sort(()=>Math.random()-0.5);
      flipped=[]; matched=0; moves=0; lock=false;
      status.textContent='Moves: 0';
      render();
    }
    function render(){
      board.innerHTML = cards.map(c=>`<button class="mem-card ${c.open||c.done?'flip':''}" data-id="${c.id}">${c.open||c.done?c.v:'❔'}</button>`).join('');
      board.querySelectorAll('.mem-card').forEach(btn=>btn.addEventListener('click', onFlip));
    }
    function onFlip(e){
      if(lock) return;
      const id = +e.target.dataset.id;
      const card = cards.find(c=>c.id===id);
      if(card.open||card.done) return;
      card.open = true; flipped.push(card);
      render();
      if(flipped.length===2){
        moves++; status.textContent = 'Moves: '+moves;
        lock = true;
        setTimeout(()=>{
          if(flipped[0].v===flipped[1].v){
            flipped[0].done=true; flipped[1].done=true; matched++;
          } else {
            flipped[0].open=false; flipped[1].open=false;
          }
          flipped=[]; lock=false; render();
          if(matched===set.length){ status.textContent = `Solved in ${moves} moves! 🎉`; }
        }, 600);
      }
    }
    container.querySelector('.game-reset').addEventListener('click', setup);
    setup();
  }

  // ---------- Snake ----------
  function buildSnake(container){
    container.innerHTML = `<div class="app-pad game-wrap">
      <div class="snake-status">Score: 0 — swipe or use arrow keys</div>
      <canvas class="snake-canvas"></canvas>
      <div class="snake-pad">
        <div></div><button data-d="up">↑</button><div></div>
        <button data-d="left">←</button><button data-d="down">↓</button><button data-d="right">→</button>
      </div>
      <button class="game-reset">Restart</button>
    </div>`;
    const canvas = container.querySelector('.snake-canvas');
    const status = container.querySelector('.snake-status');
    const cols=16, rows=16;
    let cell, snake, dir, nextDir, food, score, alive, loopId;
    function resize(){
      const w = Math.min(canvas.parentElement.clientWidth-4, 320);
      cell = Math.floor(w/cols);
      canvas.width = cell*cols; canvas.height = cell*rows;
      draw();
    }
    const ro = new ResizeObserver(resize); ro.observe(canvas.parentElement);
    const myWin = container.closest('.window');
    function reset(){
      snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];
      dir={x:1,y:0}; nextDir={x:1,y:0};
      placeFood(); score=0; alive=true;
      status.textContent='Score: 0 — swipe or use arrow keys';
      clearInterval(loopId);
      loopId = setInterval(step, 140);
      requestAnimationFrame(resize);
    }
    function placeFood(){
      do{ food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}; }
      while(snake.some(s=>s.x===food.x&&s.y===food.y));
    }
    function step(){
      if(!alive) return;
      if(myWin && myWin.style.display==='none') return; // paused while minimized
      dir = nextDir;
      const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
      if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){
        alive=false; status.textContent = `Game over — score ${score}. Tap Restart.`;
        clearInterval(loopId); draw(); return;
      }
      snake.unshift(head);
      if(head.x===food.x && head.y===food.y){ score++; status.textContent='Score: '+score; placeFood(); }
      else snake.pop();
      draw();
    }
    function draw(){
      if(!cell) return;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle='#0e1a12'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#ff6b6b';
      ctx.fillRect(food.x*cell+1,food.y*cell+1,cell-2,cell-2);
      snake.forEach((s,i)=>{
        ctx.fillStyle = i===0 ? '#7CFC9A' : '#3ecf6b';
        ctx.fillRect(s.x*cell+1,s.y*cell+1,cell-2,cell-2);
      });
    }
    function setDir(x,y){
      if(dir.x===-x && dir.y===-y) return;
      nextDir={x,y};
    }
    const keyHandler = (e)=>{
      // Only steer when the Snake window is the focused one and you're not typing somewhere.
      if(activeWin!==myWin || isTypingTarget(e.target)) return;
      const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
      if(m[e.key]){ setDir(m[e.key][0],m[e.key][1]); e.preventDefault(); }
    };
    window.addEventListener('keydown', keyHandler);
    onWindowClose(container, ()=>{
      clearInterval(loopId); alive=false;
      window.removeEventListener('keydown', keyHandler);
      ro.disconnect();
    });
    container.querySelectorAll('.snake-pad button').forEach(b=>{
      const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
      b.addEventListener('click', ()=>{ const v=m[b.dataset.d]; setDir(v[0],v[1]); });
    });
    let tsx,tsy;
    canvas.addEventListener('touchstart', e=>{ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; }, {passive:true});
    canvas.addEventListener('touchend', e=>{
      const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
      if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1);
    });
    container.querySelector('.game-reset').addEventListener('click', reset);
    reset();
  }

  // ---------- Paint (multi-tool drawing app) ----------
  function buildPaint(container){
    container.innerHTML = `<div class="paint-wrap">
      <div class="paintbar">
        <input type="color" class="p-color" value="#3b82f6" title="Color">
        <div class="p-swatches">
          ${['#000000','#ffffff','#e11d48','#f59e0b','#22a35a','#3b82f6','#8b5cf6','#ec4899'].map(c=>`<span class="p-sw" style="background:${c}" data-c="${c}"></span>`).join('')}
        </div>
        <span class="p-sep"></span>
        <button class="p-tool active" data-tool="pen" title="Pen">✏️</button>
        <button class="p-tool" data-tool="eraser" title="Eraser">🧽</button>
        <button class="p-tool" data-tool="line" title="Line">📏</button>
        <button class="p-tool" data-tool="rect" title="Rectangle">▭</button>
        <button class="p-tool" data-tool="circle" title="Circle">⭕</button>
        <button class="p-tool" data-tool="fill" title="Fill bucket">🪣</button>
        <button class="p-tool" data-tool="eyedrop" title="Eyedropper">💧</button>
        <span class="p-sep"></span>
        <label class="p-sizelabel">Size <input type="range" class="p-size" min="1" max="40" value="5"></label>
        <label class="p-sizelabel">Opacity <input type="range" class="p-opacity" min="10" max="100" value="100"></label>
        <span class="p-sep"></span>
        <button class="p-btn" data-act="undo" title="Undo">↩</button>
        <button class="p-btn" data-act="redo" title="Redo">↪</button>
        <button class="p-btn" data-act="clear" title="Clear canvas">🧹</button>
        <button class="p-btn" data-act="save" title="Save as image">💾</button>
      </div>
      <canvas class="p-canvas"></canvas>
    </div>`;

    const canvas = container.querySelector('.p-canvas');
    const colorInput = container.querySelector('.p-color');
    const sizeInput = container.querySelector('.p-size');
    const opacityInput = container.querySelector('.p-opacity');
    const ctx = canvas.getContext('2d');
    let tool = 'pen';
    let drawing = false, sx, sy, lx, ly;
    let snapshot = null;
    let undoStack = [], redoStack = [];

    function resizeCanvas(){
      const rect = canvas.getBoundingClientRect();
      const prev = canvas.width ? ctx.getImageData(0,0,canvas.width,canvas.height) : null;
      canvas.width = Math.max(1,rect.width); canvas.height = Math.max(1,rect.height);
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      if(prev) ctx.putImageData(prev,0,0);
    }
    requestAnimationFrame(resizeCanvas);
    const paintRO = new ResizeObserver(resizeCanvas); paintRO.observe(canvas);

    function pushUndo(){
      undoStack.push(canvas.toDataURL());
      if(undoStack.length>25) undoStack.shift();
      redoStack = [];
    }
    function restoreFrom(dataUrl){
      const img = new Image();
      img.onload = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
      img.src = dataUrl;
    }

    function pos(e){
      const r = canvas.getBoundingClientRect();
      if(e.touches && e.touches[0]) return {x:e.touches[0].clientX-r.left, y:e.touches[0].clientY-r.top};
      return {x:e.clientX-r.left, y:e.clientY-r.top};
    }

    function hexToRgba(hex, alpha){
      const v = parseInt(hex.slice(1),16);
      return [(v>>16)&255,(v>>8)&255,v&255,Math.round(alpha*255)];
    }
    function floodFill(startX,startY,fillHex,alpha){
      const w=canvas.width, h=canvas.height;
      const imgData = ctx.getImageData(0,0,w,h);
      const data = imgData.data;
      const sx0 = Math.floor(startX), sy0 = Math.floor(startY);
      if(sx0<0||sy0<0||sx0>=w||sy0>=h) return;
      const idx0 = (sy0*w+sx0)*4;
      const target = [data[idx0],data[idx0+1],data[idx0+2],data[idx0+3]];
      const fill = hexToRgba(fillHex, alpha);
      if(target[0]===fill[0]&&target[1]===fill[1]&&target[2]===fill[2]&&target[3]===fill[3]) return;
      const stack = [[sx0,sy0]];
      const match = (i)=> data[i]===target[0]&&data[i+1]===target[1]&&data[i+2]===target[2]&&data[i+3]===target[3];
      let guard = w*h*4;
      while(stack.length && guard-->0){
        const [cx,cy] = stack.pop();
        if(cx<0||cy<0||cx>=w||cy>=h) continue;
        const i = (cy*w+cx)*4;
        if(!match(i)) continue;
        data[i]=fill[0]; data[i+1]=fill[1]; data[i+2]=fill[2]; data[i+3]=fill[3];
        stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
      }
      ctx.putImageData(imgData,0,0);
    }

    function start(e){
      const p = pos(e);
      sx=p.x; sy=p.y; lx=p.x; ly=p.y;
      const alpha = opacityInput.value/100;
      if(tool==='fill'){
        pushUndo();
        floodFill(p.x,p.y,colorInput.value,alpha);
        return;
      }
      if(tool==='eyedrop'){
        const d = ctx.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;
        const hex = '#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
        colorInput.value = hex;
        return;
      }
      pushUndo();
      drawing = true;
      if(tool==='line'||tool==='rect'||tool==='circle'){
        snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);
      }
      e.preventDefault && e.preventDefault();
    }
    function move(e){
      if(!drawing) return;
      const p = pos(e);
      const alpha = opacityInput.value/100;
      ctx.lineCap='round'; ctx.lineJoin='round';
      if(tool==='pen'||tool==='eraser'){
        ctx.strokeStyle = tool==='eraser' ? '#ffffff' : colorInput.value;
        ctx.globalAlpha = tool==='eraser' ? 1 : alpha;
        ctx.lineWidth = sizeInput.value;
        ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke();
        ctx.globalAlpha = 1;
        lx=p.x; ly=p.y;
      } else if(tool==='line'||tool==='rect'||tool==='circle'){
        ctx.putImageData(snapshot,0,0);
        ctx.strokeStyle = colorInput.value; ctx.globalAlpha = alpha; ctx.lineWidth = sizeInput.value;
        ctx.beginPath();
        if(tool==='line'){ ctx.moveTo(sx,sy); ctx.lineTo(p.x,p.y); }
        else if(tool==='rect'){ ctx.rect(Math.min(sx,p.x),Math.min(sy,p.y),Math.abs(p.x-sx),Math.abs(p.y-sy)); }
        else if(tool==='circle'){ const r=Math.hypot(p.x-sx,p.y-sy); ctx.arc(sx,sy,r,0,Math.PI*2); }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      e.preventDefault && e.preventDefault();
    }
    function end(){ drawing=false; snapshot=null; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    onWindowClose(container, ()=>{ window.removeEventListener('mouseup', end); paintRO.disconnect(); });

        grid.appendChild(el);
        const inp = el.querySelector('.fi-rename');
        inp.focus(); inp.select();
        const commit = ()=>{ item.name = inp.value.trim()||item.name; delete item.editing; saveFS(); renderGrid(); };
        inp.addEventListener('blur', commit);
        inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); e.stopPropagation(); });

      el.innerHTML = `<div class="fi-emoji">${fileIcon(item)}</div><div class="fi-label">${esc(item.name)}</div>`;
      grid.appendChild(el);

      let dragging=false, moved=false, sx,sy,ox,oy, lastTap=0;
      function folderUnder(){
        const r1 = el.getBoundingClientRect();

        grid.querySelectorAll('.file-item.folder').forEach(f=>{
          if(f===el) return;
          const r2 = f.getBoundingClientRect();

        });

      function startDrag(x,y){ dragging=true; moved=false; sx=x; sy=y; ox=parseFloat(el.style.left)||0; oy=parseFloat(el.style.top)||0; el.style.zIndex=50; }
      function duringDrag(x,y){
        if(!dragging) return;
        const dx=x-sx, dy=y-sy;
        if(!moved && (Math.abs(dx)>5||Math.abs(dy)>5)) moved=true;
        if(!moved) return;
        const maxX=Math.max(0,grid.clientWidth-80), maxY=Math.max(0,grid.clientHeight-88);
        el.style.left = Math.min(maxX,Math.max(0,ox+dx))+'px';
        el.style.top = Math.min(maxY,Math.max(0,oy+dy))+'px';
        grid.querySelectorAll('.file-item.folder').forEach(f=>f.classList.remove('drop-target'));
        if(item.type!=='folder'){ const t=folderUnder(); if(t) t.classList.add('drop-target'); }

      function endDrag(){
        if(!dragging) return;
        dragging=false;
        if(moved){
          const t = item.type!=='folder' ? folderUnder() : null;
          grid.querySelectorAll('.file-item.folder').forEach(f=>f.classList.remove('drop-target'));
          if(t){ item.parentId = t.dataset.id; saveFS(); renderGrid(); el.style.zIndex=''; return; }
          item.x = parseFloat(el.style.left); item.y = parseFloat(el.style.top);
          saveFS();

        el.style.zIndex='';
      }
      el.addEventListener('mousedown', e=>{
        if(e.button!==0) return;
        startDrag(e.clientX,e.clientY); e.stopPropagation();
        trackPointer(duringDrag, endDrag);

      el.addEventListener('click', e=>{ e.stopPropagation(); });
      el.addEventListener('dblclick', ()=>{ if(!moved) openItem(item); });
      el.addEventListener('touchstart', e=>{ const t=e.touches[0]; startDrag(t.clientX,t.clientY); }, {passive:true});
      el.addEventListener('touchmove', e=>{ const t=e.touches[0]; duringDrag(t.clientX,t.clientY); if(moved) e.preventDefault(); }, {passive:false});
      el.addEventListener('touchend', ()=>{
        const wasMoved=moved; endDrag(); if(wasMoved) return;

      el.addEventListener('contextmenu', e=>{

  // ---------- File storage (IndexedDB; migrates the old localStorage copy) ----------
  const MAX_IMPORT = 10*1024*1024, MAX_AUDIO = 25*1024*1024;
  const fsStore = (function(){
    const DB='fauxos', STORE='kv', KEY=ACCT.fsKey;
    let memory = null; // fallback when IndexedDB isn't available
    let dbp = null;
    function db(){
      if(dbp) return dbp;
      dbp = new Promise((resolve,reject)=>{
        try{
          if(!window.indexedDB) return reject(new Error('no idb'));
          const req = indexedDB.open(DB, 1);
          req.onupgradeneeded = ()=> req.result.createObjectStore(STORE);
          req.onsuccess = ()=> resolve(req.result);
          req.onerror = ()=> reject(req.error);
        }catch(e){ reject(e); }
      });
      return dbp;
    }
    function tx(mode, fn){
      return db().then(d=> new Promise((resolve,reject)=>{
        const t = d.transaction(STORE, mode);
        const r = fn(t.objectStore(STORE));
        t.oncomplete = ()=> resolve(r && r.result);
        t.onerror = t.onabort = ()=> reject(t.error);
      }));
    }
    async function load(){
      let items;
      try{ items = await tx('readonly', s=>s.get(KEY)); }
      catch(e){ return memory || legacy() || []; }
      if(!items){
        const old = legacy();
        if(old){ items = old; try{ await save(old); localStorage.removeItem('fauxos-fs'); }catch(e){} }
      }
      return items || [];
    }
    function legacy(){
      if(KEY !== 'fs') return null;   // only the original (guest) space had pre-IndexedDB files
      try{ return JSON.parse(localStorage.getItem('fauxos-fs')); }catch(e){ return null; }
    }
    function save(items){
      memory = items;
      return tx('readwrite', s=>s.put(items, KEY));
    }
    // account housekeeping
    const copyKey = async (from, to)=>{ const v = await tx('readonly', s=>s.get(from)); if(v) await tx('readwrite', s=>s.put(v, to)); };
    const removeKey = k=> tx('readwrite', s=>s.delete(k));
    return {load, save, copyKey, removeKey};
  })();

  const CL_KEY_MAP = {ArrowUp:1, ArrowDown:2, ArrowLeft:3, ArrowRight:4, ' ':5, Enter:6, Escape:7};
  function clEvalExpr(expr, vars){
    try{
      if(expr===undefined||expr===null||expr==='') return 0;
      let s = String(expr).trim();
      if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
      if(!/^[0-9a-zA-Z_+\-*/(). ,<>=!&|]*$/.test(s)) return 0;
      // turn a lone '=' into '==' for friendlier comparisons, without touching ==, !=, <=, >=
      s = s.replace(/([^=!<>])=(?!=)/g, '$1==');
      const names = Object.keys(vars);
      const fn = new Function(...names, 'random', `"use strict";return (${s});`);
      const v = fn(...names.map(k=>vars[k]), (a,b)=>Math.random()*(b-a)+a);
      if(typeof v==='boolean') return v?1:0;
      return typeof v==='number' && !isNaN(v) ? v : 0;
    }catch(e){ return 0; }
  }
  function clInterpolate(str, vars){
    return String(str).replace(/\$([a-zA-Z_]\w*)/g, (m,name)=> (name in vars ? String(vars[name]) : m));
  }
  function clCloneBlock(b){
    return {type:b.type, value:(b.value && typeof b.value==='object') ? {...b.value} : b.value};
  }

    const scriptEl = container.querySelector('.cl-script');
